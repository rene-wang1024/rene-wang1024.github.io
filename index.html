<body>
<style>
/* Layout: the workshop illustration is the hero; live labels sit on each station; below it, the day's human-in-the-loop funnel and the project cards. Day/night follows Toronto time. */
:root{
  --bg:#f7f3ee; --panel:#ffffff; --panel-2:#fbf8f4; --line:#e8e1d8; --ink:#1d1a17; --muted:#6e665d; --faint:#a39a8f;
  --coral:#e2674f; --amber:#c98a12; --sky:#3f7fd6; --ok:#1f8a5a; --warn:#c98a12; --bad:#d0412a;
  --chip:rgba(255,255,255,.88); --chip-line:rgba(29,26,23,.1); --shadow:0 6px 24px rgba(60,40,20,.08);
  --f-num:"Barlow Condensed","Noto Sans SC",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
:root[data-mode="night"]{
  --bg:#0b0f17; --panel:#121826; --panel-2:#161d2c; --line:#253047; --ink:#ecf0f6; --muted:#9aa4b8; --faint:#5f6a80;
  --coral:#ff8a72; --amber:#f4bf55; --sky:#7db7ff; --ok:#62d6a0; --warn:#f4bf55; --bad:#ff6b57;
  --chip:rgba(18,24,38,.86); --chip-line:rgba(255,255,255,.1); --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;transition:background .4s,color .4s}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:4px}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:16px}
.me{display:flex;flex-direction:column;line-height:1.2}
.me b{font-family:var(--f-num);font-size:22px;font-weight:600;letter-spacing:.02em}
.me span{font-size:12.5px;color:var(--muted)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel)}
.seg button{padding:4px 11px;border-radius:999px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.clock{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
/* intro */
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 32px;flex-wrap:wrap;padding-block:2px 18px}
.intro p{margin:0;max-width:68ch;color:var(--muted);font-size:15px;line-height:1.6;text-wrap:pretty}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);text-decoration:none;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;transition:border-color .2s,color .2s}
.links a:hover{border-color:var(--coral);color:var(--coral)}
.links a[hidden]{display:none}
.links svg{width:14px;height:14px;fill:currentColor}
footer .links a,.links.mini a{padding:4px 10px;font-size:11.5px}
.links.mini{margin-top:8px}

/* hero */
.hero{position:relative}
.stage{position:relative;width:100%;aspect-ratio:1312/941;border-radius:18px;overflow:hidden}
@media (min-width:821px){.stage{width:min(100%,1000px,calc((100vh - 185px) * 1.394));width:min(100%,1000px,calc((100svh - 185px) * 1.394));margin-inline:auto}}
/* the illustration's empty left 360px are cropped; all overlays stay in full-image % coordinates on .canvas */
.canvas{position:absolute;top:0;bottom:0;left:-27.44%;width:127.44%}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s}
.stage img.night{opacity:0}
:root[data-mode="night"] .stage img.night{opacity:1}
.flow{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
/* desk loop video placed over the illustration's desk (box measured in 1672×941 image space) */
.deskv{position:absolute;left:48.33%;top:22.64%;width:29.43%;height:52.29%;object-fit:cover;z-index:1;pointer-events:none;transition:opacity .6s;
  -webkit-mask-image:radial-gradient(ellipse 50% 47% at 50% 55%,#000 74%,transparent 100%);mask-image:radial-gradient(ellipse 50% 47% at 50% 55%,#000 74%,transparent 100%)}
.deskv.night{opacity:0}
:root[data-mode="night"] .deskv.night{opacity:1}
:root[data-mode="night"] .deskv.day{opacity:0}
:root[data-mode="night"] .flow .cube{filter:drop-shadow(0 0 5px rgba(255,190,100,.55))}
.flow .cube{filter:drop-shadow(0 2px 2px rgba(80,50,20,.18))}
.headline{position:absolute;left:3.2%;top:6%;width:27%;display:flex;flex-direction:column;gap:12px;z-index:2}
.headline h1{margin:0;font-family:var(--f-num);font-weight:600;font-size:clamp(26px,3.3vw,46px);line-height:.98;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.headline h1 em{font-style:normal;color:var(--coral)}
.headline p{margin:0;color:var(--muted);font-size:clamp(13px,1.15vw,15.5px);max-width:40ch}
.sample{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;color:var(--warn);border:1px dashed var(--warn);border-radius:999px;padding:2px 9px;align-self:flex-start}

/* station labels */
.st{position:absolute;transform:translate(-50%,-100%);z-index:3;display:flex;flex-direction:column;align-items:center;text-decoration:none}
.st.down{transform:translate(-50%,0);flex-direction:column-reverse}
.st.left{transform:translate(-100%,-50%);flex-direction:row}
.st.left .stem{width:14px;height:1px}
.st.right{transform:translate(0,-50%);flex-direction:row-reverse}
.st.right .stem{width:14px;height:1px}
.st .card{background:var(--chip);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--chip-line);border-radius:10px;padding:6px 10px 7px;box-shadow:var(--shadow);text-align:left;flex:none;width:max-content}
.st .row{display:flex;align-items:center;gap:7px}
.tag{display:inline-flex!important;flex-direction:row!important;white-space:nowrap;align-items:baseline;gap:4px;margin-left:4px;padding:1px 7px;border-radius:999px;font-family:var(--f-num);font-size:14px;font-weight:600;line-height:1.3}
.tag i{display:inline!important;font-style:normal;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.tag.rn{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.tag.rn i{color:var(--muted)}
.tag.me{background:color-mix(in srgb,var(--coral) 16%,transparent);color:var(--coral)}
.tag.wn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.st .name{font-weight:600;font-size:12.5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.st .metric{display:none;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;margin-top:3px}
.brief{display:grid;grid-template-columns:repeat(3,auto);gap:0 12px;margin-top:5px}
.brief span{display:flex;flex-direction:column;line-height:1.1}
.brief b{font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.brief b.wn{color:var(--warn)} .brief b.me{color:var(--coral)}
.brief i{white-space:nowrap;font-style:normal;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.st .metric b{color:var(--ink);font-weight:500}
.st .stem{width:1px;height:14px;background:var(--chip-line)}
.st:hover .card,.st:focus-visible .card{border-color:var(--ink)}
.desk{position:absolute;transform:translate(-50%,-50%);z-index:4}
.desk .badge{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 12px 6px 7px;box-shadow:var(--shadow);font-size:12.5px;white-space:nowrap}
.desk .badge b{font-family:var(--f-num);font-size:20px;line-height:1;background:var(--coral);color:#fff;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;padding:0 6px}
.out{position:absolute;transform:translate(-100%,-50%);z-index:3;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--chip);border:1px solid var(--chip-line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.out b{color:var(--ink);font-weight:500}

/* funnel */
.funnel{margin-top:20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fs{padding:16px 18px;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.fs + .fs{border-left:1px solid var(--line)}
.fs + .fs::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--panel);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.fs b{font-family:var(--f-num);font-size:44px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.fs.me-step b{color:var(--coral)}
.fs p{margin:0;color:var(--muted);font-size:13px}
.ratio{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:13.5px}
.ratio .bar2{flex:1;min-width:160px;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.ratio .bar2 i{display:block;height:100%}

/* projects */
section.block{margin-top:44px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sh h2{margin:0;font-family:var(--f-num);font-weight:600;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.projects{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.projects .pj{grid-column:span 2}
.projects .pj:nth-child(-n+2){grid-column:span 3}
@media (max-width:980px){.projects{grid-template-columns:repeat(2,minmax(0,1fr))}.projects .pj,.projects .pj:nth-child(-n+2){grid-column:span 1}.projects .pj:last-child{grid-column:1 / -1}}
@media (max-width:640px){.projects{grid-template-columns:1fr}.projects .pj:last-child{grid-column:auto}}
.pj{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;text-decoration:none}
a.pj:hover{border-color:var(--ink)}
.pj .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pj h3{margin:0;font-size:16px;font-weight:600}
.pj p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.pj .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pj .kv div{display:flex;flex-direction:column}
.pj .kv b{font-family:var(--f-num);font-size:26px;line-height:1;font-weight:600}
.pj .kv span{font-size:11.5px;color:var(--muted)}
.pj .ctrl-line{min-height:3.1em;font-family:var(--f-mono);font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:9px}
.pj .go{font-family:var(--f-mono);font-size:11.5px;color:var(--sky)}
.pj .go a{color:inherit;text-decoration:none}
.pj .go.muted{color:var(--faint)}
a.pj:hover .go,.pj .go a:hover{text-decoration:underline;text-underline-offset:3px}
.pill{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* method */
.method{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:980px){.method{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mt{border-top:2px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.mt.h{border-color:var(--coral)}
.mt span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
.mt.h span{color:var(--coral)}
.mt b{font-size:15px}
.mt p{margin:0;color:var(--muted);font-size:13px}
footer{margin-top:44px;border-top:1px solid var(--line);padding-block:16px 40px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--faint);font-size:12.5px}


/* station drawer */
.hot{position:absolute;transform:translate(-50%,-50%);width:11%;aspect-ratio:1;border-radius:50%;z-index:2;cursor:pointer}
.hot:hover{background:radial-gradient(closest-side,color-mix(in srgb,var(--ink) 8%,transparent),transparent)}
.st{cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;transform:translateX(105%);transition:transform .25s ease;overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:18px;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.drawer.on{transform:none}
.drawer > *{flex-shrink:0}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh h3{margin:0;font-family:var(--f-num);font-weight:600;font-size:28px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.dh .x{font-family:var(--f-mono);font-size:18px;line-height:1;padding:6px 10px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.dstat{font-size:13.5px;color:var(--muted)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.big3 div{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.big3 div+div{border-left:1px solid var(--line)}
.big3 b{font-family:var(--f-num);font-size:36px;line-height:1;font-weight:600}
.big3 b.hot2{color:var(--warn)} .big3 b.me{color:var(--coral)}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.strip i{display:block;aspect-ratio:1;border-radius:3px;background:var(--line)}
.strip i.ok{background:var(--ok)} .strip i.warn{background:var(--warn)} .strip i.bad{background:var(--bad)} .strip i.idle{background:transparent;border:1.5px dashed var(--bad)} .strip i.off{background:var(--line)}
.strip-axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--faint);margin-top:4px}
.legend2{display:flex;flex-wrap:wrap;gap:10px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:8px}
.legend2 span{display:flex;align-items:center;gap:5px}
.legend2 i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tasks{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tasks li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;font-size:13.5px}
.tasks li+li{border-top:1px solid var(--line)}
.tasks .tm{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.res{font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:999px;white-space:nowrap}
.res.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.res.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.res.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.res.auto{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.res.wip{color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,transparent)}
.res.plan,.res.manual{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent)}
.wfl .who{display:block;font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--muted);margin-top:2px}
.res.off{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent)}
.iss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.iss li{border-left:3px solid var(--warn);padding:2px 0 2px 10px;font-size:13.5px}
.iss li.bad{border-color:var(--bad)}
.iss .empty{border:0;padding:0;color:var(--muted)}
.dsplit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dsplit div{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.dsplit b{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;margin-bottom:3px;color:var(--sky)}
.dsplit div.h b{color:var(--coral)}
.dlink{font-family:var(--f-mono);font-size:12px;color:var(--sky)}
/* mobile list replaces on-image labels */
.mlist{display:none}
.mlist .mi{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:border-color .2s}
.mlist .mi:hover{border-color:var(--ink)}
.mlist .mi .name{font-weight:600;font-size:13.5px;flex:1;min-width:0}
.mlist .mi .metric{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
/* desktop: the station list sits left of the illustration; on-image labels keep only names */
@media (min-width:821px){
  .hero{display:grid;grid-template-columns:minmax(270px,320px) minmax(0,1fr);gap:20px;align-items:center}
  .mlist{display:grid;order:-1;grid-template-columns:1fr;gap:8px}
  .st{display:none!important}
}
@media (max-width:820px){
  .st,.out{display:none}
  .hero{display:flex;flex-direction:column}
  .headline{position:static;width:auto;padding-block:8px 16px;order:-1}
  .stage{border-radius:14px}
  .desk .badge{font-size:11px;padding:4px 9px 4px 5px}
  .desk .badge b{font-size:16px;min-width:22px;height:22px}
  .mlist{display:grid;grid-template-columns:1fr;gap:6px;margin-top:12px}
  .funnel{grid-template-columns:1fr 1fr}
  .fs:nth-child(3){border-left:0}

function renderFlow(){

  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const st=M.stations, cap=n=>Math.max(0,Math.min(3,n|0));
  const spec=[
    ['mainA', 5, 9, 15],
    ['mainB', 12, 26, 16],
    ['inbox', cap(st.inbox.toMe), 7, 14],
    ['career', cap(st.career.toMe), 5, 14],
    ['vocab', cap(st.vocab.toMe), 6, 14],
    ['out', cap(st.inbox.done+st.career.done), 9, 14]
  ];
  let h='';
  spec.forEach(([lane,n,dur,size],li)=>{
    const d=crPath(LANES[lane]);
    for(let i=0;i<n;i++){
      const col=((i+li)%3===0)?'coral':'cream'; const off=-(dur*i/n).toFixed(2);
      if(still){ continue; }
      h+=`<g class="cube" opacity="0">${cube(col,size)}
        <animateMotion dur="${dur}s" begin="${off}s" repeatCount="indefinite" path="${d}"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="${dur}s" begin="${off}s" repeatCount="indefinite"/></g>`;
    }
  });
  if(!still) h+=ambient();
  svg.innerHTML=h;
}
let typeTimer=null;
const TYPE_LINES={en:['review: privacy update…','decide: apply? → yes','flag: deadline in 5 days','skip: needs 10+ yrs','reply? → I write it'],
  zh:['审阅：隐私法规更新…','判断：申请吗？→ 申请','提醒：5 天后截止','跳过：要求 10 年以上','回复？→ 我自己写']};
function startTyping(){
  if(typeTimer){clearTimeout(typeTimer);typeTimer=null;}
  const tx=document.getElementById('typetext'), cur=document.getElementById('typecur'); if(!tx) return;
  const lines=TYPE_LINES[lang]; let li=0, ci=0, del=false;
  const place=()=>{ try{ const w=tx.getComputedTextLength(); cur.setAttribute('x',1062+w+3); }catch(e){} };
  const step=()=>{ const L=lines[li]; 
    if(!del){ ci++; tx.textContent=L.slice(0,ci); place(); if(ci>=L.length){del=true; typeTimer=setTimeout(step,1600); return;} typeTimer=setTimeout(step,lang==='en'?70:140); }
    else { ci--; tx.textContent=L.slice(0,ci); place(); if(ci<=0){del=false; li=(li+1)%lines.length; typeTimer=setTimeout(step,350); return;} typeTimer=setTimeout(step,28); } };
  step();
}
function ambient(){
  const night=document.documentElement.dataset.mode==='night';
  const gold='#f6c461', coral='#f08a72', teal='#5fd3b0';
  let s=`<defs>
    <radialGradient id="g-lamp"><stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-shield"><stop offset="0" stop-color="#7db7ff" stop-opacity=".55"/><stop offset="1" stop-color="#7db7ff" stop-opacity="0"/></radialGradient>
  </defs>`;
  /* lamp breathing */
  s+=`<ellipse cx="1140" cy="395" rx="95" ry="70" fill="url(#g-lamp)" opacity=".5"><animate attributeName="opacity" values=".25;.7;.25" dur="4s" repeatCount="indefinite"/></ellipse>`;
  /* shield halo */
  s+=`<ellipse cx="1495" cy="365" rx="150" ry="125" fill="url(#g-shield)" opacity=".4"><animate attributeName="opacity" values=".15;.55;.15" dur="5s" repeatCount="indefinite"/></ellipse>`;
  /* envelopes dropping into inbox */
  [0,1].forEach(i=>{ s+=`<g opacity="0"><rect x="-13" y="-9" width="26" height="18" rx="2.5" fill="#fbf1e0" stroke="${coral}" stroke-width="1.5"/><path d="M-13,-9 L0,2 L13,-9" fill="none" stroke="${coral}" stroke-width="1.5"/>
    <animateMotion dur="3.2s" begin="${i*1.6}s" repeatCount="indefinite" path="M${672+i*30},40 L${680+i*24},150"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.75;1" dur="3.2s" begin="${i*1.6}s" repeatCount="indefinite"/></g>`; });
  /* career: light running along the gold arc */
  s+=`<circle r="6" fill="${gold}" opacity=".95"><animateMotion dur="3.5s" repeatCount="indefinite" path="M1108,190 C1160,170 1215,135 1268,96"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.5s" repeatCount="indefinite"/></circle>`;
  /* sleeping cat z's */
  [0,1,2].forEach(i=>{ s+=`<text x="0" y="0" font-family="IBM Plex Sans,sans-serif" font-weight="600" font-size="${16+i*4}" fill="${night?'#c9d0dd':'#8a8178'}" opacity="0">z
    <animateMotion dur="4.5s" begin="${i*1.5}s" repeatCount="indefinite" path="M655,575 C665,550 650,530 672,505"/>
    <animate attributeName="opacity" values="0;.9;0" dur="4.5s" begin="${i*1.5}s" repeatCount="indefinite"/></text>`; });
  /* mic sound waves */
  [0,1,2].forEach(i=>{ s+=`<ellipse cx="1305" cy="660" rx="60" ry="60" fill="none" stroke="${coral}" stroke-width="2.5" opacity="0">
    <animate attributeName="rx" values="60;135" dur="3s" begin="${i}s" repeatCount="indefinite"/><animate attributeName="ry" values="60;125" dur="3s" begin="${i}s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;0" dur="3s" begin="${i}s" repeatCount="indefinite"/></ellipse>`; });
  /* status dot clusters twinkle */
  [[737,113,teal],[1240,48,gold],[1520,243,teal],[605,436,teal],[1343,576,teal]].forEach(([x,y,c],i)=>{
    s+=`<circle cx="${x}" cy="${y}" r="24" fill="none" stroke="${c}" stroke-width="2" opacity="0"><animate attributeName="r" values="10;30" dur="2.4s" begin="${i*0.4}s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="2.4s" begin="${i*0.4}s" repeatCount="indefinite"/></circle>`; });
  return s;
}

/* character state: normal | studying | strength | meeting | social. Read from status.json (published by a scheduled task; category only, no calendar details). ?state= previews one. */

function setCharacter(k){ const c=CHAR[k]||CHAR.normal;
  document.querySelectorAll('.deskv').forEach(v=>{ const m=v.classList.contains('night')?'night':'day'; const [src,poster]=c[m];
    if(v.getAttribute('src')===src) return; v.setAttribute('poster',poster); v.setAttribute('src',src); try{ v.load(); if(v.autoplay) v.play().catch(()=>{}); }catch(e){} });
  document.documentElement.dataset.char=k in CHAR?k:'normal'; }
(async()=>{ let k=null;
  try{ k=new URLSearchParams(location.search).get('state'); }catch(e){}

  /* privacy: outside weekdays 10:00–18:00 Toronto time the character always shows the normal state (a ?state= preview still works) */
  const preview=(()=>{ try{ return new URLSearchParams(location.search).has('state'); }catch(e){ return false; } })();
  const h=torontoHour();
  let wd=1; try{ wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(new Intl.DateTimeFormat('en-US',{weekday:'short',timeZone:'America/Toronto'}).format(new Date())); }catch(e){ wd=new Date().getDay(); }

})();
