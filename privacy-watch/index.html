<body>
<style>
/* Layout: a regulator-watch console — three jurisdiction status cards, a year timeline, an obligation radar, then a log of developments. Single dark theme by choice. */
:root{
  color-scheme:dark;
  --bg:#0d1119; --panel:#141a26; --panel-2:#1a2231; --line:#263044; --line-2:#334059;
  --ink:#e9edf5; --muted:#8d98ad; --faint:#5c677d;
  --fed:#ff7a66; --on:#f4bf55; --qc:#6fb3ff;
  --ok:#62d6a0; --warn:#f4bf55;
  --f-num:"Barlow Condensed","Noto Sans SC",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.035) 1px,transparent 0);background-size:22px 22px}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:var(--ink);text-decoration-color:var(--line-2);text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--qc);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono)}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.c-federal{--c:var(--fed)} .c-ontario{--c:var(--on)} .c-quebec{--c:var(--qc)}

/* top bar */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.14em}
.brand b{font-weight:500}
.brand .flags{display:flex;gap:3px}
.brand .flags i{width:4px;height:14px;border-radius:1px;background:var(--c)}
.right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.live .p{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(98,214,160,.6);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(98,214,160,0)}100%{box-shadow:0 0 0 0 rgba(98,214,160,0)}}
.lang{display:flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.lang button{padding:4px 10px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px 40px;align-items:end}
.hero h1{font-family:var(--f-num);font-weight:600;font-size:clamp(34px,5.4vw,58px);line-height:.98;letter-spacing:.005em;text-transform:uppercase}
.hero h1 em,#evh1 em{font-style:normal;color:var(--muted)}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.totals{display:flex;gap:28px;justify-content:flex-end;flex-wrap:wrap}
.totals div{display:flex;flex-direction:column}
.totals b{font-family:var(--f-num);font-size:44px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}

/* jurisdiction cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;min-width:0;transition:border-color .15s,background .15s}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c)}
.card{cursor:pointer}
.card:hover{border-color:var(--line-2)}
.card .status{text-align:left;width:100%;border-radius:6px;margin:0 -6px;padding:10px 6px 6px;width:calc(100% + 12px)}
.card .status:hover{background:rgba(255,255,255,.04)}
.card .status .arr{color:var(--c);font-family:var(--f-mono);font-size:12px}
.card .go{align-self:flex-start;padding:2px 0}
.card .go{font-family:var(--f-mono);font-size:11.5px;color:var(--c);letter-spacing:.04em}
.card:hover .go{text-decoration:underline;text-underline-offset:3px}
.card[aria-current="true"]{border-color:var(--c);background:var(--panel-2)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .code{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--c)}
.card .reg{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.card .num{display:flex;align-items:baseline;gap:10px}
.card .num b{font-family:var(--f-num);font-size:56px;line-height:.9;font-weight:600;font-variant-numeric:tabular-nums}
.card .num span{color:var(--muted);font-size:13px;line-height:1.3}
.card .status{font-size:13.5px;line-height:1.4;border-top:1px dashed var(--line-2);padding-top:10px;display:flex;gap:8px}
.card .status .k{font-family:var(--f-mono);font-size:10.5px;color:var(--c);letter-spacing:.08em;white-space:nowrap;padding-top:2px}
.spark{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;align-items:end;height:34px}
.spark i{display:block;background:var(--c);opacity:.85;border-radius:1.5px;min-height:2px}
.spark i.z{background:var(--line-2);opacity:1}
.months{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;font-family:var(--f-mono);font-size:9.5px;color:var(--faint);text-align:center;margin-top:4px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:14px}
.ph h2{font-family:var(--f-num);font-weight:600;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.key{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;color:var(--muted);align-items:center}
.key span{display:flex;align-items:center;gap:6px}
.key i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}

/* timeline */
.tl{position:relative;overflow-x:auto}
.tl svg{display:block;width:100%;min-width:640px;height:auto}
@media (max-width:640px){.tl svg{min-width:860px}}
.tl .dotbtn{cursor:pointer}
.tl .dotbtn:focus-visible circle.ring{stroke:var(--ink)}

/* radar */
.radar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ob{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 10px 9px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.ob:hover{border-color:var(--line-2)}
.ob[aria-pressed="true"]{border-color:var(--ink)}
.ob .n{font-size:13px;font-weight:500;line-height:1.25;min-height:2.5em}
.ob .bars{display:flex;flex-direction:column;gap:4px}
.ob .row{display:grid;grid-template-columns:22px 1fr 14px;gap:6px;align-items:center;font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}
.ob .track{display:block;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.ob .fill{display:block;height:100%;background:var(--c);border-radius:3px}
.ob .row .pd{width:7px;height:7px;border:1px dashed var(--muted);border-radius:2px}
.base{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.base > div{border-top:2px solid var(--c);padding-top:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.base .t{font-family:var(--f-mono);font-size:11px;color:var(--c);letter-spacing:.1em}
.base p{margin:0;font-size:13.5px}
.base .bs{font-family:var(--f-mono);font-size:11px;color:var(--muted);word-break:break-word}
.base .pend{font-size:13px;color:var(--ink);background:rgba(255,255,255,.04);border:1px dashed var(--line-2);border-radius:6px;padding:7px 9px}
.base .pend b{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--warn);display:block;margin-bottom:2px;font-weight:500}

/* log */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line-2);border-radius:6px;padding:4px 10px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .sw{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.active-filter{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.active-filter button{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.log{list-style:none;margin:0;padding:0}
.log li{border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.row-btn{width:100%;display:grid;grid-template-columns:86px 44px minmax(0,1fr) 40px 16px;gap:12px;align-items:center;padding:12px 4px;text-align:left}
.row-btn:hover{background:rgba(255,255,255,.025)}
.row-btn .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.jt{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--c);border:1px solid var(--c);border-radius:4px;padding:1px 0;text-align:center}
.row-btn .ti{display:flex;flex-direction:column;gap:2px;min-width:0}
.row-btn .ti b{font-weight:500;font-size:14.5px;line-height:1.35}
.row-btn .ti small{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.imp{display:flex;gap:2px;justify-content:flex-end}
.imp i{width:5px;height:12px;border-radius:1px;background:var(--line-2)}
.imp.l1 i:nth-child(-n+1),.imp.l2 i:nth-child(-n+2),.imp.l3 i:nth-child(-n+3){background:var(--ink)}
.chev{color:var(--faint);transition:transform .15s;font-family:var(--f-mono)}
.row-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.exp{padding:0 4px 16px 154px;display:flex;flex-direction:column;gap:10px}
.exp p{margin:0;max-width:74ch;color:#c9d0dd}
.exp .w{border-left:2px solid var(--c);padding-left:10px;color:var(--ink)}
.exp .w b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--c);margin-right:8px;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px}
.src{font-family:var(--f-mono);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.note{color:var(--warn);font-size:11.5px}
.more{display:flex;justify-content:center;margin-top:10px}
.more button{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:6px 14px}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:s}
.st{padding:4px 18px 4px 0;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.st + .st{padding-left:18px;border-left:1px dashed var(--line-2)}
.st .who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;padding:2px 7px;border-radius:4px;align-self:flex-start}
.st .who.ai{color:var(--qc);background:rgba(111,179,255,.1)}
.st .who.me{color:var(--ok);background:rgba(98,214,160,.1)}
.st h3{font-family:var(--f-num);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.st p{margin:0;color:var(--muted);font-size:13px}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;color:var(--faint);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .totals{justify-content:flex-start}
  .radar{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .cards{grid-template-columns:1fr}
  .card .num b{font-size:46px}
  .base{grid-template-columns:1fr}
  .row-btn{grid-template-columns:44px minmax(0,1fr) 34px;gap:10px}
  .row-btn .d,.row-btn .chev{display:none}
  .row-btn .ti small::before{content:attr(data-date) " · "}
  .exp{padding-left:4px}
  .pipe{grid-template-columns:1fr 1fr;gap:16px 0}
  .st:nth-child(3){border-left:0;padding-left:0}
}

/* tabs + events */
.tabs{display:flex;gap:2px;border:1px solid var(--line-2);border-radius:8px;padding:3px;background:var(--panel)}
.tabs button{padding:6px 14px;border-radius:6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.ev-head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px 40px;align-items:end}
.ev-next{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.ev-next b{font-family:var(--f-num);font-size:44px;line-height:1;font-weight:600}
.agenda{display:flex;flex-direction:column;gap:22px}
.mon{display:flex;flex-direction:column;gap:8px}
.mon h3{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding-bottom:6px}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:start;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.ev:hover{border-color:var(--line-2)}
.cal{border:1px solid var(--line-2);border-radius:8px;text-align:center;overflow:hidden}
.cal span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;background:var(--panel-2);color:var(--muted);padding:3px 0}
.cal b{display:block;font-family:var(--f-num);font-size:30px;line-height:1.15;font-weight:600}
.ev .main{display:flex;flex-direction:column;gap:6px;min-width:0}
.ev .main a{font-weight:500;font-size:15px;line-height:1.35;text-decoration:none}
.ev .main a:hover{text-decoration:underline}
.ev .main p{margin:0;color:var(--muted);font-size:13.5px}
.fmt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:4px;white-space:nowrap}
.fmt.in_person{color:var(--on);background:rgba(244,191,85,.1)} .fmt.virtual{color:var(--qc);background:rgba(111,179,255,.1)} .fmt.hybrid{color:var(--ok);background:rgba(98,214,160,.1)}
.ev .days{font-family:var(--f-mono);font-size:11px;color:var(--faint);white-space:nowrap;text-align:right}
@media (max-width:640px){.ev-head{grid-template-columns:1fr}.ev{grid-template-columns:52px minmax(0,1fr)}.ev .days{grid-column:2;text-align:left}.cal b{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="bar">
    <div class="brand"><span class="flags"><i class="c-federal"></i><i class="c-ontario"></i><i class="c-quebec"></i></span><b>PRIVACY WATCH</b><span style="color:var(--faint)">/ CA</span><a href="../" style="margin-left:14px;color:var(--muted);text-decoration:none;font-size:11.5px">← RENE WANG</a></div>
    <div class="tabs" role="tablist" aria-label="Views"><button type="button" role="tab" id="tab-watch" data-view="watch"></button><button type="button" role="tab" id="tab-events" data-view="events"></button></div>
    <div class="right">
      <span class="live"><span class="p"></span><span id="checked"></span></span>
      <div class="lang" role="group" aria-label="Language"><button type="button" id="lang-en" data-lang="en">EN</button><button type="button" id="lang-zh" data-lang="zh">中文</button></div>
    </div>
  </div>

  <div id="view-watch" style="display:contents">
  <section class="hero">
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <h1 id="h1"></h1>
      <p data-t="sub"></p>
    </div>
    <div class="totals" id="totals"></div>
  </section>

  <section class="cards" id="cards" aria-label="Jurisdictions"></section>

  <section class="panel">
    <div class="ph"><h2 data-t="tlH"></h2><div class="key" id="tl-key"></div></div>
    <div class="tl" id="tl"></div>
  </section>

  <section class="panel" id="radar-sec" style="scroll-margin-top:16px">
    <div class="ph"><h2 data-t="radarH"></h2><span class="lbl" data-t="radarHint"></span></div>
    <div class="radar" id="radar"></div>
    <div class="base" id="base"></div>
  </section>

  <section class="panel" id="log-sec" style="scroll-margin-top:16px">
    <div class="ph"><h2 data-t="logH"></h2><div class="active-filter" id="af"></div></div>
    <div class="filters" id="filters" style="margin-bottom:10px"></div>
    <ul class="log" id="log"></ul>
    <div class="more" id="more"></div>
  </section>

  <section class="panel">
    <div class="ph"><h2 data-t="pipeH"></h2></div>
    <div class="pipe" id="pipe"></div>
  </section>

  </div>
  <div id="view-events" hidden>
    <section class="ev-head" style="margin-bottom:22px">
      <div style="display:flex;flex-direction:column;gap:12px;min-width:0"><h1 id="evh1" style="font-family:var(--f-num);font-weight:600;font-size:clamp(34px,5.4vw,58px);line-height:.98;text-transform:uppercase"></h1><p data-t="evSub" style="margin:0;color:var(--muted);max-width:52ch"></p></div>
      <div class="ev-next" id="ev-next"></div>
    </section>
    <div class="filters" id="ev-filters" style="margin-bottom:16px"></div>
    <div class="agenda" id="agenda"></div>
  </div>

<script id="data" type="application/json">{"regs": [{"jurisdiction": "federal", "checked_at": "2026-10-25", "baseline": {"accountability": {"now_zh": "组织对其控制的个人信息负责，须指定专人负责合规；含委托处理的信息", "now_en": "Organizations are accountable for personal information under their control, including data sent to processors, and must designate someone responsible for compliance.", "basis": "PIPEDA Sch. 1, Principle 4.1", "pending_zh": "明确要求建立并维持隐私管理计划（政策、投诉处理、员工培训等）", "pending_en": "Organizations would have to implement and maintain a privacy management program (policies, complaint handling, staff training, explanatory materials).", "pending_basis": "Bill C-36 (45-1), Protecting Privacy and Consumer Data Act s.7(1), s.8, s.9(1)"}, "consent": {"now_zh": "收集、使用、披露须获有意义同意；同意有效须个人能理解后果", "now_en": "Knowledge and meaningful consent are required to collect, use or disclose personal information; consent is valid only if the individual would understand the consequences.", "basis": "PIPEDA s.6.1; Sch. 1, Principle 4.3", "pending_zh": "默认明示同意；新增“正当利益”免同意例外，须先识别利益并做PIA", "pending_en": "Express consent would be the default; a new legitimate-interest exception would apply only after the organization identifies its interest and completes a PIA.", "pending_basis": "Bill C-36 (45-1), Protecting Privacy and Consumer Data Act s.15(1), s.15(5), s.18(3)-(5)"}, "breach": {"now_zh": "存在重大损害实际风险的泄露须报告OPC、通知个人并留存所有泄露记录", "now_en": "Breaches posing a real risk of significant harm must be reported to the OPC and notified to individuals; records of all breaches must be kept.", "basis": "PIPEDA s.10.1, s.10.3; Breach of Security Safeguards Regulations", "pending_zh": "沿用“重大损害实际风险”标准，向新设委员会报告；服务商须通知控制方", "pending_en": "The real-risk-of-significant-harm test would remain, with reports going to the new Commission; service providers would have to notify the controlling organization.", "pending_basis": "Bill C-36 (45-1), Protecting Privacy and Consumer Data Act s.58, s.59, s.60, s.61"}, "pia": {"now_zh": "私营部门无一般性法定PIA义务（OPC指引建议进行）", "now_en": "PIPEDA has no general statutory PIA requirement for private-sector organizations; OPC guidance recommends them.", "basis": "PIPEDA (no express provision)", "pending_zh": "依赖正当利益前及向境外披露/传输前须按规定做PIA", "pending_en": "A PIA would be required before relying on legitimate interest and before disclosing or transferring personal information outside Canada.", "pending_basis": "Bill C-36 (45-1), Protecting Privacy and Consumer Data Act s.18(4)(b), s.57(1)(a)"}, "crossborder": {"now_zh": "不禁止出境；转移方仍负责，须以合同等方式确保可比保护", "now_en": "Cross-border transfers are not prohibited; the transferring organization remains accountable and must ensure comparable protection by contract or other means.", "basis": "PIPEDA Sch. 1, Principle 4.1.3", "pending_zh": "出境前须做PIA并采取合同、认证等缓解措施", "pending_en": "Before any transfer outside Canada, organizations would have to complete a PIA and adopt mitigation measures such as contracts, codes of practice or certification.", "pending_basis": "Bill C-36 (45-1), Protecting Privacy and Consumer Data Act s.57(1), s.11(1)"}, "adm_ai": {"now_zh": "无自动化决策或AI专门条款，适用一般原则（同意、公开、准确）", "now_en": "There are no provisions specific to automated decisions or AI; the general principles (consent, openness, accuracy) apply.", "basis": "PIPEDA Sch. 1, Principles 4.3, 4.6, 4.8", "pending_zh": "须公开自动化决策系统的一般说明；应请求解释有重大影响的决定", "pending_en": "Organizations would have to publish a general account of automated decision systems and, on request, explain predictions or decisions with legal or similarly significant effects.", "pending_basis": "Bill C-36 (45-1), Protecting Privacy and Consumer Data Act s.2(1), s.62(2)(c), s.63(4)-(6)"}, "rights": {"now_zh": "访问权与更正权；须在30日内答复，可依规定延期", "now_en": "Individuals have rights of access and correction; organizations must respond within 30 days, with extensions allowed in limited cases.", "basis": "PIPEDA s.8(3)-(4); Sch. 1, Principle 4.9", "pending_zh": "新增删除（处置）权与数据可携权；仍为30日答复期", "pending_en": "New disposal (deletion) and data-mobility rights would be added; the 30-day response period would remain.", "pending_basis": "Bill C-36 (45-1), Protecting Privacy and Consumer Data Act s.54, s.63, s.67(1), s.71, s.72"}, "children": {"now_zh": "无未成年人专门条款；OPC立场：13岁以下通常需父母同意", "now_en": "PIPEDA has no child-specific provisions; the OPC's position is that children under 13 generally need parental consent.", "basis": "PIPEDA (no express provision); OPC guidance", "pending_zh": "“儿童”指未满18岁，其个人信息属敏感信息；父母可代为行使权利", "pending_en": "A child would be anyone under 18, and children's personal information would be treated as sensitive; parents or guardians could exercise rights on a child's behalf.", "pending_basis": "Bill C-36 (45-1), Protecting Privacy and Consumer Data Act s.2(1), s.4(a)"}, "security": {"now_zh": "须采取与信息敏感度相称的物理、组织和技术保障措施", "now_en": "Organizations must use physical, organizational and technological safeguards proportionate to the sensitivity of the information.", "basis": "PIPEDA Sch. 1, Principle 4.7", "pending_zh": "保留相称性保障义务，并明确须含合理的身份认证措施", "pending_en": "The proportionate-safeguards duty would remain and would expressly include reasonable identity-authentication measures.", "pending_basis": "Bill C-36 (45-1), Protecting Privacy and Consumer Data Act s.56(1), s.56(3)"}, "enforcement": {"now_zh": "OPC调查并发布结论，无命令权和罚款权；可向联邦法院申请救济", "now_en": "The OPC investigates and issues findings but cannot make orders or impose fines; complainants or the OPC can seek remedies in Federal Court.", "basis": "PIPEDA ss.11-17.1 (complaints, compliance agreements), ss.14-16 (Federal Court), s.28 (offences)", "pending_zh": "引入行政罚款，上限为1000万加元或全球营收3%（取高）；设私人诉权", "pending_en": "Administrative monetary penalties of up to the greater of $10M or 3% of global gross revenue, plus a private right of action.", "pending_basis": "Bill C-36 (45-1), Protecting Privacy and Consumer Data Act ss.113-114, s.132"}}, "items": [{"id": "fed-001", "type": "legislation", "title": "Bill C-36, An Act to enact the Protecting Privacy and Consumer Data Act, to amend the Personal Information Protection and Electronic Documents Act and to make amendments to other Acts", "title_zh": "C-36法案：《保护隐私与消费者数据法》", "title_short_en": "Bill C-36: Protecting Privacy and Consumer Data Act", "date": "2026-06-15", "org": "Parliament", "url": "https://www.parl.ca/LegisInfo/en/bill/45-1/c-36", "summary_zh": "联邦政府于2026年6月15日提出C-36法案，拟制定《保护隐私与消费者数据法》并废除PIPEDA第1部分（PIPEDA改称《电子文件法》）。法案引入隐私管理计划、正当利益例外、出境前PIA、自动化决策解释权、删除权与数据可携权，以及最高1000万加元或全球营收3%的行政罚款。", "summary_en": "Introduced on June 15, 2026, Bill C-36 would enact the Protecting Privacy and Consumer Data Act and repeal Part 1 of PIPEDA, which would be renamed the Electronic Documents Act. It adds privacy management programs, a legitimate-interest exception, PIAs before transfers outside Canada, explanations of automated decisions, disposal and mobility rights, and penalties of up to the greater of $10M or 3% of global revenue.", "impact_zh": "法案尚在一读后阶段，未成为法律；组织可关注二读及委员会审议，并对照现有隐私计划、跨境传输和自动化决策流程评估差距。", "impact_en": "Not yet law. Organizations should watch second reading and committee study, and compare their privacy programs, cross-border transfers and automated decision processes against the bill.", "obligations": ["accountability", "consent", "breach", "pia", "crossborder", "adm_ai", "rights", "children", "security", "enforcement"], "impact_level": "high", "status_zh": "众议院一读完成（2026-06-15），待二读；截至2026-10-25无二读辩论记录", "status_en": "First reading completed in the House of Commons (2026-06-15); awaiting second reading, with no debate recorded as of 2026-10-25", "verified": true, "note": "Status from LEGISinfo JSON (\"At second reading in the House of Commons\", no second reading activity). Provisions verified from first-reading text on parl.ca DocumentViewer.", "pending": true}, {"id": "fed-002", "type": "ai", "title": "Joint Investigation of OpenAI OpCo, LLC (PIPEDA Findings #2026-002)", "title_zh": "OpenAI（ChatGPT）联合调查结论", "title_short_en": "Joint investigation of OpenAI's ChatGPT", "date": "2026-05-06", "org": "OPC (with CAI Québec, OIPC BC, OIPC Alberta)", "url": "https://priv.gc.ca/en/opc-actions-and-decisions/investigations/investigations-into-businesses/2026/pipeda-2026-002-overview/", "summary_zh": "OPC与魁北克、BC、阿尔伯塔监管机构认定，OpenAI为训练模型从公开来源和授权数据集收集个人信息范围过宽，且未取得有效同意；公开、准确、访问/更正/删除、保存期限和问责方面的投诉均成立。OPC基于OpenAI的整改承诺认定为“有条件解决”，OpenAI须按季度报告进展。", "summary_en": "The OPC and its Québec, BC and Alberta counterparts found that OpenAI collected personal information from public sources and licensed datasets for model training too broadly and without valid consent. Complaints on openness, accuracy, access, correction, deletion, retention and accountability were also well-founded. The OPC treated the matter as conditionally resolved based on OpenAI's commitments, including quarterly reports.", "impact_zh": "开发或部署生成式AI的组织应核查训练数据来源与同意依据、保存期限政策，以及处理训练数据中个人信息的访问和删除请求的能力。", "impact_en": "Organizations that build or deploy generative AI should review where training data comes from and the consent basis for it, their retention policies, and how they handle access and deletion requests for personal information in training data.", "obligations": ["consent", "accountability", "rights", "adm_ai"], "impact_level": "high", "status_zh": null, "status_en": null, "verified": true}, {"id": "fed-003", "type": "ai", "title": "Commissioner-initiated complaints concerning X Corp.'s and X.AI LLC's compliance with PIPEDA (PIPEDA Findings #2026-004)", "title_zh": "X与xAI（Grok深度伪造）调查结论", "title_short_en": "X and xAI: Grok sexualized deepfakes findings", "date": "2026-06-11", "org": "OPC", "url": "https://www.priv.gc.ca/en/opc-actions-and-decisions/investigations/investigations-into-businesses/2026/pipeda-2026-004/", "summary_zh": "OPC认定X与xAI未取得被描绘者的有效明示同意即利用Grok生成性化深度伪造图像，违反同意原则（4.3）及第5(3)条“适当目的”要求。投诉成立但未解决，两公司不认同结论，但承诺提交季度报告和第三方审计。", "summary_en": "The OPC found that X and xAI let Grok generate sexualized deepfakes without valid express consent from the people depicted, breaching the consent principle (4.3) and the appropriate-purposes requirement in s.5(3). The complaint is well-founded but not resolved: the companies disagree with the findings but committed to quarterly reports and third-party audits.", "impact_zh": "上线生成式图像等高风险AI功能前，应做针对该功能的风险评估并部署有效防滥用措施；OPC在第5(3)条分析中批评了PIA不充分（未覆盖@Grok等功能）。", "impact_en": "Before launching high-risk generative AI features such as image generation, organizations should assess that specific feature's risks and put working anti-misuse safeguards in place. The OPC criticized gaps in the PIA as part of its s.5(3) analysis.", "obligations": ["consent", "pia", "adm_ai", "children", "accountability"], "impact_level": "high", "status_zh": null, "status_en": null, "verified": true, "note": "Investigation expanded on 2026-01-14 (news release 2026-01-15, nr-c_260115). The 2026-06-11 news release also lists law-reform recommendations to government."}, {"id": "fed-004", "type": "decision", "title": "Investigation of Unauthorized Disclosures and Modifications of Taxpayer Personal Information at the Canada Revenue Agency (Special Report to Parliament)", "title_zh": "加拿大税务局（CRA）泄露事件特别报告", "title_short_en": "CRA taxpayer data breaches: special report", "date": "2026-05-07", "org": "OPC", "url": "https://www.priv.gc.ca/en/opc-actions-and-decisions/ar_index/202526/sr_pa_20260507_cra", "summary_zh": "OPC依《隐私法》向议会提交特别报告，统计自2020年以来CRA发生逾4.2万起未经授权访问或篡改纳税人信息的事件，认定CRA违反《隐私法》第6(2)条和第8(2)条。九项建议（涉及多因素认证、零信任、监测和泄露追踪等）中CRA全部接受8项、部分接受1项，结论为“成立并有条件解决”。", "summary_en": "In a special report to Parliament under the Privacy Act, the OPC counted more than 42,000 unauthorized accesses to or changes of taxpayer data at the CRA since 2020 and found breaches of ss.6(2) and 8(2) of the Act. The CRA accepted eight of nine recommendations in full and one in part, covering MFA, zero trust, monitoring and breach tracking. The complaint is well-founded and conditionally resolved.", "impact_zh": "OPC要求采用强多因素认证并系统追踪泄露事件，对接入政府系统的组织和私营部门的身份认证设计都有参考意义。", "impact_en": "The OPC's call for strong MFA and systematic breach tracking is a useful benchmark for authentication design, both for organizations connected to government systems and for the private sector.", "obligations": ["security", "breach"], "impact_level": "medium", "status_zh": null, "status_en": null, "verified": true, "note": "Federal public sector (Privacy Act)."}, {"id": "fed-005", "type": "decision", "title": "Privacy Commissioner of Canada tables in Parliament Special Report on ArriveCAN app investigation", "title_zh": "ArriveCAN应用调查特别报告", "title_short_en": "ArriveCAN app investigation: special report", "date": "2026-03-12", "org": "OPC", "url": "https://www.priv.gc.ca/en/opc-news/news-and-announcements/2026/nr-c_260312/", "summary_zh": "OPC调查未发现ArriveCAN收集的个人信息以违反《隐私法》的方式被使用或披露，也未认定违法。但调查发现加拿大边境服务局（CBSA）对承包商的管理存在缺陷，CBSA已接受相关建议。", "summary_en": "The OPC found no evidence that personal information collected through ArriveCAN was used or disclosed in breach of the Privacy Act, and identified no contraventions. It did find weaknesses in how CBSA managed contractors, and CBSA accepted the recommendations.", "impact_zh": "外包涉及个人信息时，应在授标前完成安全要求评估、明确任务范围并按最小必要原则限制访问权限。", "impact_en": "When outsourcing work that involves personal information, organizations should complete security assessments before contract award, define task scope clearly and limit access to what is strictly necessary.", "obligations": ["accountability", "security"], "impact_level": "low", "status_zh": null, "status_en": null, "verified": true, "note": "Federal public sector (Privacy Act). Verified from the OPC news release."}, {"id": "fed-006", "type": "decision", "title": "Investigation into the personal information retention practices of Loblaw for the PC Optimum Loyalty Program (PIPEDA Findings #2026-001)", "title_zh": "Loblaw PC Optimum会员数据保存调查", "title_short_en": "Loblaw PC Optimum: data retention and anonymization", "date": "2026-03-05", "org": "OPC", "url": "https://www.priv.gc.ca/en/opc-actions-and-decisions/investigations/investigations-into-businesses/2026/pipeda-2026-001/", "summary_zh": "OPC认定Loblaw处理删除请求和咨询过慢（原则4.10，成立并已解决），且在账户删除后保留的数据未能证明已充分匿名化（原则4.5.3，成立并有条件解决）。Loblaw虽不认同匿名化结论，但承诺委托第三方独立评估其匿名化流程，并建立客服记录保存期限。", "summary_en": "The OPC found that Loblaw was too slow handling deletion requests and inquiries (Principle 4.10, well-founded and resolved), and could not show that data kept after account deletion was adequately anonymized (Principle 4.5.3, well-founded and conditionally resolved). Loblaw disagreed on anonymization but committed to an independent third-party assessment and to retention schedules for customer support logs.", "impact_zh": "以“匿名化”替代删除时，应能证明不存在被重新识别的实质可能（如IP地址、邮箱域名、备份数据带来的风险）。", "impact_en": "Organizations that anonymize data instead of deleting it should be able to show there is no serious possibility of re-identification, for example from IP addresses, email domains or backups.", "obligations": ["rights", "accountability"], "impact_level": "medium", "status_zh": null, "status_en": null, "verified": true}, {"id": "fed-007", "type": "decision", "title": "Investigation into Bell's compliance with PIPEDA when responding to an access request for personal information (PIPEDA Findings #2026-003)", "title_zh": "Bell共享账户访问请求调查", "title_short_en": "Bell: access request on a shared mobile account", "date": "2026-06-04", "org": "OPC", "url": "https://www.priv.gc.ca/en/opc-actions-and-decisions/investigations/investigations-into-businesses/2026/pipeda-2026-003/", "summary_zh": "Bell约两个月才答复访问请求且未发出延期通知，违反PIPEDA第8(3)条；以账户持有人未同意为由拒绝向实际使用人提供其本人通话记录，违反原则4.9。OPC另指出Bell的隐私政策在公开性方面存在问题，Bell已承诺整改。", "summary_en": "Bell took about two months to answer an access request without sending an extension notice, breaching s.8(3) of PIPEDA. It also breached Principle 4.9 by refusing a line user his own call logs because the account holder had not consented. The OPC also raised an openness concern about Bell's privacy policy, and Bell committed to fixes.", "impact_zh": "应严格遵守30日答复期限及延期通知要求；共享账户下，实际使用人对本人数据享有访问权。", "impact_en": "Organizations should meet the 30-day response deadline and the extension-notice rules. On shared accounts, the actual user has a right of access to their own data.", "obligations": ["rights"], "impact_level": "low", "status_zh": null, "status_en": null, "verified": true, "note": "Findings dated 2026-01-09; listed on the OPC website on 2026-06-04."}, {"id": "fed-008", "type": "decision", "title": "Compliance Letter to the Office of the Privacy Commissioner of Canada (\"OPC\") By WestJet, an Alberta Partnership", "title_zh": "WestJet网络安全事件合规承诺函", "title_short_en": "WestJet breach: compliance letter to the OPC", "date": "2026-07-08", "org": "OPC", "url": "https://www.priv.gc.ca/en/opc-actions-and-decisions/investigations/investigations-into-businesses/2026/2026-westjet-cl/", "summary_zh": "2025年6月WestJet遭社会工程攻击，攻击者绕过多因素认证，约516.4万名加拿大员工和客户的信息受影响；OPC就安全保障措施和通知个人的情况展开调查。WestJet承诺提交经OPC认可的独立安全评估报告并回应其建议；承诺函不构成认定违法。", "summary_en": "In June 2025 a social-engineering attack bypassed WestJet's MFA and affected about 5,164,000 Canadian employees and customers; the OPC investigated WestJet's safeguards and its notices to affected individuals. WestJet committed to an independent, OPC-approved security assessment and to respond to its recommendations. The letter is not a finding of a contravention.", "impact_zh": "应评估管理员账户抵御社会工程攻击的能力及多因素认证强度；OPC可通过合规承诺函方式了结调查。", "impact_en": "Organizations should test how well administrator accounts withstand social engineering and how strong their MFA is. The OPC can close an investigation through a compliance letter.", "obligations": ["security", "breach", "enforcement"], "impact_level": "medium", "status_zh": null, "status_en": null, "verified": true, "note": "Letter signed 2026-07-08; page modified 2026-07-14."}, {"id": "fed-009", "type": "guidance", "title": "Assessing whether and how to use age assurance – Guidance for websites and online services", "title_zh": "年龄验证（Age Assurance）指引", "title_short_en": "Age assurance guidance for websites and services", "date": "2026-05-04", "org": "OPC", "url": "https://www.priv.gc.ca/en/privacy-topics/age-assurance/aa-gd-web/", "summary_zh": "OPC发布面向网站和在线服务运营者的年龄验证指引（另有面向年龄验证技术开发者的版本）。指引指出年龄验证不应成为访问互联网的默认条件，只有在法律要求或存在针对儿童的特定伤害时才可使用，并应选择与风险相称、侵入性最小的方式。", "summary_en": "The OPC issued age assurance guidance for website and online service operators, with a companion version for age assurance developers. It says age assurance should not be a default condition for using the internet, should be used only for a legal requirement or a child-specific harm, and should use the least intrusive method proportionate to the risk.", "impact_zh": "年龄验证结果只能用于验证本身，不得用于画像或广告；运营者仍须对第三方年龄验证服务商负责，并提供申诉机制。", "impact_en": "Age assurance results may be used only for the age check, not for profiling or advertising. Operators remain accountable for third-party age assurance providers and must offer an appeal mechanism.", "obligations": ["children", "consent", "accountability"], "impact_level": "medium", "status_zh": null, "status_en": null, "verified": true}, {"id": "fed-010", "type": "guidance", "title": "Consultation on the Development of a Children's Privacy Code: What We Heard", "title_zh": "儿童隐私守则咨询结果报告", "title_short_en": "Children's Privacy Code: what we heard", "date": "2026-05-04", "org": "OPC", "url": "https://www.priv.gc.ca/en/about-the-opc/what-we-do/consultations/completed-consultations/consultation-children-code/report_children-code_2026/", "summary_zh": "OPC汇总了2025年儿童隐私守则咨询的意见：受访者支持守则覆盖“儿童可能访问”的产品和服务，并支持采用风险分级、高隐私默认设置及禁止欺骗性设计等措施。OPC表示正在起草守则，但受访者指出现行PIPEDA无法使守则具有强制执行力。", "summary_en": "The OPC summarized feedback from its 2025 consultation on a children's privacy code. Respondents supported covering products and services likely to be accessed by children, a risk-based approach, high privacy defaults and a ban on deceptive design. The OPC is drafting the code, though respondents noted that PIPEDA as written would not make it enforceable.", "impact_zh": "面向儿童或儿童可能使用的服务，可关注守则草案进展，以及“13岁以下通常需父母同意”等OPC立场。", "impact_en": "Services aimed at, or likely used by, children should watch for the draft code and follow OPC positions such as parental consent generally being needed for children under 13.", "obligations": ["children", "pia"], "impact_level": "medium", "status_zh": null, "status_en": null, "verified": true}, {"id": "fed-011", "type": "legislation", "title": "Bill C-22, An Act respecting lawful access (Lawful Access Act, 2026)", "title_zh": "C-22法案：《2026年合法访问法》", "title_short_en": "Bill C-22: Lawful Access Act, 2026", "date": "2026-03-12", "org": "Parliament", "url": "https://www.parl.ca/LegisInfo/en/bill/45-1/C-22", "summary_zh": "公共安全部长于2026年3月12日提出C-22法案，涉及执法机关的合法访问权限；该法案于2026年6月18日在众议院三读通过，同日在参议院完成一读。隐私专员于2026年5月26日在众议院公共安全委员会作证，认为法案较前身C-2有所改进，但仍需修订以加强隐私保护。", "summary_en": "The Minister of Public Safety introduced Bill C-22 on lawful access on March 12, 2026. It passed third reading in the House of Commons on June 18, 2026 and received first reading in the Senate the same day. The Privacy Commissioner told the House public safety committee on May 26, 2026 that the bill improves on its predecessor, C-2, but still needs amendments to strengthen privacy protection.", "impact_zh": "电信和在线服务提供者等可能收到执法机关请求的组织，可关注参议院审议及最终文本。", "impact_en": "Organizations that may receive law-enforcement requests, such as telecom and online service providers, should watch Senate review and the final text.", "obligations": ["security", "rights"], "impact_level": "medium", "status_zh": "众议院已三读通过（2026-06-18）；参议院一读完成（2026-06-18），待二读；未获御准", "status_en": "Passed third reading in the House of Commons (2026-06-18); first reading completed in the Senate (2026-06-18), awaiting second reading; no Royal Assent", "verified": true, "note": "Stage dates from LEGISinfo JSON. The bill's substantive provisions were not reviewed here; the summary is limited to its progress and the OPC's position (news release nr-c_260526)."}, {"id": "fed-012", "type": "legislation", "title": "Government of Canada launches review of the Privacy Act", "title_zh": "联邦政府启动《隐私法》现代化审查", "title_short_en": "Federal government launches Privacy Act review", "date": "2026-04-02", "org": "Treasury Board of Canada Secretariat", "url": "https://www.canada.ca/en/treasury-board-secretariat/news/2026/04/government-of-canada-launches-review-of-the-privacy-act.html", "summary_zh": "国库委员会秘书处启动对适用于250多个联邦机构的《隐私法》的审查，提议承认隐私为基本权利、引入与国际标准一致的原则和定义，并允许在政府项目间安全共享数据；公众意见征集截至2026年7月10日。OPC于2026年8月6日提交意见，支持将泄露通知、高风险活动PIA和自动化决策透明度写入法律，并建议加强执法机制。", "summary_en": "The Treasury Board Secretariat opened a review of the Privacy Act, which covers more than 250 federal institutions. It proposes recognizing privacy as a fundamental right, adding principles and definitions aligned with international standards, and allowing secure data sharing across government programs; comments were due July 10, 2026. In an August 6, 2026 submission, the OPC supported making breach notification, PIAs for high-risk activities and automated-decision transparency legal requirements, and called for stronger enforcement.", "impact_zh": "主要影响联邦机构及为其处理数据的承包商；政府预计于2026-27年冬季发布汇总报告。", "impact_en": "This mainly affects federal institutions and contractors that handle data for them. The government expects to publish a summary report in winter 2026-27.", "obligations": ["breach", "pia", "adm_ai", "enforcement"], "impact_level": "low", "status_zh": "政策咨询阶段（尚无法案）", "status_en": "Policy consultation stage (no bill yet)", "verified": true, "note": "Federal public sector. OPC submission news release: https://www.priv.gc.ca/en/opc-news/news-and-announcements/2026/nr-c_260806/"}, {"id": "fed-013", "type": "ai", "title": "Government of Canada launches public consultation on AI transparency", "title_zh": "联邦政府启动AI透明度公众咨询", "title_short_en": "Federal public consultation on AI transparency", "date": "2026-07-23", "org": "Innovation, Science and Economic Development Canada", "url": "https://www.canada.ca/en/innovation-science-economic-development/news/2026/07/government-of-canada-launches-public-consultation-on-ai-transparency.html", "summary_zh": "ISED就AI透明度措施征求意见，议题包括标识AI生成内容、告知用户正在与AI交互、披露AI系统的能力与局限、追踪严重AI事件及监测AI代理活动，截止日期为2026年9月23日。新闻稿未说明是否将据此立法。", "summary_en": "ISED sought input on AI transparency measures, including labelling AI-generated content, telling people when they are dealing with AI, disclosing AI systems' capabilities and limits, tracking serious AI incidents and monitoring AI agents. Comments closed September 23, 2026. The release does not say whether legislation will follow.", "impact_zh": "部署面向用户的AI系统的组织可关注后续政策动向，尤其是AI生成内容标识和事件报告要求。", "impact_en": "Organizations deploying user-facing AI should watch for follow-up measures, especially on labelling AI-generated content and incident reporting.", "obligations": ["adm_ai"], "impact_level": "low", "status_zh": null, "status_en": null, "verified": true, "note": "Not a privacy statute, but relevant to AI × privacy transparency. Consultation closed 2026-09-23."}, {"id": "fed-014", "type": "guidance", "title": "Championing privacy in the age of AI: 2025-2026 Annual Report to Parliament on the Privacy Act and the Personal Information Protection and Electronic Documents Act", "title_zh": "OPC 2025-26年度报告《AI时代守护隐私》", "title_short_en": "OPC annual report 2025-26: privacy in the age of AI", "date": "2026-06-04", "org": "OPC", "url": "https://www.priv.gc.ca/en/opc-news/news-and-announcements/2026/nr-c_260604/", "summary_zh": "年度报告显示，PIPEDA投诉为3,044件（同比增加109%），《隐私法》投诉为3,146件（增加62%）；企业报告泄露近700起，影响逾2,000万加拿大人。报告重点关注儿童隐私和AI等新兴技术。", "summary_en": "The annual report shows 3,044 PIPEDA complaints (up 109%) and 3,146 Privacy Act complaints (up 62%). Businesses reported almost 700 breaches affecting more than 20 million Canadians. The report focuses on children's privacy and emerging technologies such as AI.", "impact_zh": "投诉和泄露数量大幅上升，显示监管活跃度提高；儿童隐私和AI是OPC的执法与指引重点。", "impact_en": "Sharp rises in complaints and breach reports point to more regulatory activity, with children's privacy and AI at the centre of OPC enforcement and guidance.", "obligations": ["breach", "children", "adm_ai"], "impact_level": "low", "status_zh": null, "status_en": null, "verified": true, "note": "Verified from the OPC news release; the full report was not opened."}, {"id": "news-001", "type": "news", "title": "Loblaw says some customers affected by data breach", "title_short_en": "Loblaw customer data breach", "title_zh": "Loblaw客户数据泄露事件", "date": "2026-03-10", "org": "The Canadian Press (via Canadian Grocer)", "url": "https://canadiangrocer.com/loblaw-says-some-customers-affected-data-breach", "summary_en": "Loblaw Cos. Ltd., parent of Loblaws and Shoppers Drug Mart, notified some customers of a \"low-level data breach\" in which a criminal third party accessed names, phone numbers and email addresses on a contained, non-critical part of its IT network. The company said passwords, health information and credit card data were not compromised, PC Financial was not affected, and all customers were signed out of their accounts.", "summary_zh": "Loblaw集团（Loblaws和Shoppers Drug Mart的母公司）通知部分客户发生一起“低级别数据泄露”：犯罪第三方进入其IT网络中一个受隔离的非核心部分，获取了姓名、电话号码和电子邮箱。公司称密码、健康信息和信用卡数据未受影响，PC Financial未受波及，并已将所有客户登出账户。", "impact_en": "Even contact-data breaches at loyalty and retail platforms can reach very large populations; organizations should be ready to scope affected individuals quickly and to explain which data categories were and were not involved.", "impact_zh": "即使仅涉及联系方式，会员和零售平台的泄露也可能波及庞大人群；企业应能迅速确定受影响人数，并清楚说明涉及与未涉及的数据类别。", "obligations": ["breach", "security"], "impact_level": "high", "verified": true, "note": "Scale: a CTV News/Canadian Press headline of 2026-10-23 says the March breach affected about two million Canadians and that notices are being sent; the article body was not retrievable, so only the headline/summary was verified (https://www.ctvnews.ca/business/article/loblaw-says-march-data-breach-affected-about-two-million-canadians/). Separate from the OPC PC Optimum retention item (fed-006).", "partial": true}, {"id": "news-002", "type": "news", "title": "Toronto Crime Stoppers chair explains decision to pause program after breach", "title_short_en": "Crime Stoppers tip platform breach", "title_zh": "Crime Stoppers举报平台数据泄露", "date": "2026-10-21", "org": "CP24 / CTV News", "url": "https://www.cp24.com/local/toronto/2026/10/22/please-do-not-send-us-tips-toronto-crime-stoppers-says-following-data-breach/", "summary_en": "Hackers breached P3, the anonymous-tip software owned by Navigate360 and used by Crime Stoppers programs, in March 2026; Toronto Crime Stoppers says 176,859 tips submitted from January 2022 to November 2025 and 14,973 associated names were stolen. Toronto Crime Stoppers paused accepting tips and Toronto police suspended use of the tip line while the breach is reviewed.", "summary_zh": "2026年3月，黑客入侵了Navigate360旗下、供Crime Stoppers项目使用的匿名举报软件P3；多伦多Crime Stoppers称，2022年1月至2025年11月提交的176,859条举报及14,973个相关姓名被盗。多伦多Crime Stoppers已暂停接收举报，多伦多警方也在审查期间暂停使用该举报热线。", "impact_en": "A vendor breach can undo a core promise such as anonymity; organizations should verify vendor security claims, limit retention of sensitive historical records, and plan how to suspend a service if a vendor is compromised.", "impact_zh": "供应商泄露可能直接破坏“匿名”等核心承诺；组织应核实供应商的安全声明，限制敏感历史记录的保存期限，并预先规划供应商被攻破时如何暂停服务。", "obligations": ["security", "breach", "accountability"], "impact_level": "high", "verified": true, "note": "National scale is from a secondary report: MobileSyrup (2026-10-21), summarizing a CBC News investigation, says over 1.5 million Canadian Crime Stoppers tips were leaked, more than 850,000 containing personally identifiable information. The CBC page itself could not be opened. Assigned 'federal' as a national, multi-program incident.", "partial": true}, {"id": "news-003", "type": "news", "title": "Canada Life breach exposes data of up to 70,000 people – mostly customers", "title_short_en": "Canada Life breach: up to 70,000 people", "title_zh": "Canada Life泄露：最多7万人受影响", "date": "2026-04-20", "org": "Insurance Business Canada", "url": "https://www.insurancebusinessmag.com/ca/news/breaking-news/canada-life-breach-exposes-data-of-up-to-70000-people--mostly-customers-572504.aspx", "summary_en": "Canada Life disclosed unauthorized access to certain applications through an employee account, affecting up to 70,000 people, most of them members of one large corporate customer's group benefits and retirement plan. Names, dates of birth, mailing addresses, gender and annual income levels were involved; the ShinyHunters group had claimed on X to have accessed Canada Life data.", "summary_zh": "Canada Life披露，有人通过一个员工账户未经授权访问了部分应用程序，最多7万人受影响，其中大多数是某一大型企业客户团体福利和退休计划的成员。涉及的信息包括姓名、出生日期、邮寄地址、性别和年收入水平；ShinyHunters团伙此前曾在X上声称获取了Canada Life的数据。", "impact_en": "Compromised employee accounts remain a common entry point; strong authentication and access monitoring for staff accounts, plus clear notification to group-plan sponsors, are key.", "impact_zh": "员工账户被攻破仍是常见入侵途径；应对员工账户实施强身份验证和访问监控，并向团体计划发起方清晰通报。", "obligations": ["security", "breach"], "impact_level": "medium", "verified": true, "note": "Canada Life said affected individuals would be contacted and offered free credit monitoring."}, {"id": "news-004", "type": "news", "title": "Ottawa agrees to $8.7M settlement over CRA-related data breach", "title_short_en": "$8.7M settlement for 2020 CRA account breaches", "title_zh": "2020年CRA账户泄露案和解870万元", "date": "2026-05-07", "org": "Insurance Business Canada (reporting a Federal Court approval)", "url": "https://www.insurancebusinessmag.com/ca/news/cyber/ottawa-agrees-to-8-7m-settlement-over-crarelated-data-breach-574436.aspx", "summary_en": "The Federal Court (Justice Richard Southcott) approved a $8,760,500.90 settlement of the class action over 2020 credential-stuffing attacks on federal online services, including CRA My Account, in which about 47,000 accounts were accessed and used to file CERB and CESB claims. Class members can receive up to $80 or $200 for time spent, and up to $5,000 from a separate fund for out-of-pocket losses.", "summary_zh": "联邦法院（Richard Southcott法官）批准了一项8,760,500.90加元的集体诉讼和解，该案涉及2020年针对联邦在线服务（包括CRA My Account）的撞库攻击，约4.7万个账户被访问并被用于冒名申请CERB和CESB。集体成员可就耗费的时间获得最高80元或200元补偿，另有专项基金可报销最高5,000元的实际损失。", "impact_en": "Credential-stuffing and login misconfigurations can lead to class-action liability years later; organizations should enforce multi-factor verification and monitor for reused credentials.", "impact_zh": "撞库攻击和登录配置错误可能在数年后引发集体诉讼责任；组织应强制多重验证并监测重复使用的凭证。", "obligations": ["security", "breach", "enforcement"], "impact_level": "medium", "verified": true, "note": "Article says approval came in the week of 2026-05-07; exact order date not verified. Separate development from the OPC special report on CRA breaches (fed-004).", "partial": true}, {"id": "news-005", "type": "news", "title": "23andMe $4.5-million class action approved, June deadline set for claims", "title_short_en": "23andMe C$4.5M Canadian breach settlement", "title_zh": "23andMe加拿大泄露案和解450万加元", "date": "2026-03-27", "org": "CP24 / CTV News (The Canadian Press)", "url": "https://www.cp24.com/news/canada/2026/03/27/23andme-45-million-class-action-approved-june-deadline-set-for-claims/", "summary_en": "A US$3.25 million (about C$4.5 million) settlement of Canadian class actions over 23andMe's 2023 data breach, which affected nearly 320,000 Canadians, was approved and finalized on March 16, 2026. Eligible claimants can receive up to $2,500 with documented expenses or about $17.77 without, with online claims due June 25.", "summary_zh": "针对23andMe 2023年数据泄露（近32万加拿大人受影响）的加拿大集体诉讼和解金额为325万美元（约450万加元），已获批准并于2026年3月16日最终确定。有费用凭证的合格申请人最多可获2,500元，无凭证者约17.77元，网上申请截止日期为6月25日。", "impact_en": "Breaches of genetic and health data carry lasting litigation exposure, including through insolvency; the case also shows that Canadian regulators could not impose a penalty comparable to the U.K. fine under current law.", "impact_zh": "基因和健康数据泄露带来的诉讼风险持续存在，即使公司进入破产程序；本案也显示，在现行法律下加拿大监管机构无法处以与英国罚款相当的处罚。", "obligations": ["security", "breach", "enforcement"], "impact_level": "medium", "verified": true, "note": "Canadian class actions were filed in the Supreme Court of British Columbia; approval ran through U.S. and Canadian bankruptcy courts."}, {"id": "news-006", "type": "news", "title": "Microsoft beefs up its digital sovereignty tech as businesses seek more control", "title_short_en": "Microsoft adds Canadian data-sovereignty tools", "title_zh": "微软为加拿大客户推出数据主权新工具", "date": "2026-10-20", "org": "The Logic", "url": "https://thelogic.co/news/microsoft-azure-digital-sovereignty-canada/", "summary_en": "Microsoft announced tools letting Canadian customers run more of its cloud and AI services on infrastructure they own and control, monitor where and how Microsoft stores their data, and add encryption for data processed on their own servers. The move builds on its December 2025 sovereignty plan and responds to concerns that the U.S. CLOUD Act could compel disclosure of data stored abroad.", "summary_zh": "微软宣布推出新工具，使加拿大客户能在自有并自控的基础设施上运行更多云和AI服务、监控微软存储其数据的位置和方式，并为在自有服务器上处理的数据增加加密。此举延续其2025年12月的数据主权计划，回应了外界对美国《CLOUD法案》可能强制披露境外存储数据的担忧。", "impact_en": "Data residency and foreign-access risk are now a procurement topic; organizations should document where data is stored and processed and how vendor commitments address foreign legal demands.", "impact_zh": "数据驻留和境外调取风险已成为采购议题；组织应记录数据的存储和处理地点，以及供应商承诺如何应对外国法律调取要求。", "obligations": ["crossborder", "security", "accountability"], "impact_level": "medium", "verified": true}]}, {"jurisdiction": "ontario", "checked_at": "2026-10-25", "baseline": {"accountability": {"now_zh": "私营企业适用联邦PIPEDA；省/市公共机构适用FIPPA/MFIPPA；健康托管人适用PHIPA", "now_en": "Private businesses fall under federal PIPEDA; provincial institutions under FIPPA, municipal institutions under MFIPPA; health information custodians under PHIPA, which makes them accountable for agents and requires a contact person.", "basis": "PIPEDA Sch. 1 Principle 4.1; FIPPA; MFIPPA; PHIPA ss. 15(3), 17", "pending_zh": null, "pending_en": null, "pending_basis": null}, "consent": {"now_zh": "公共机构凭法定授权收集（非同意制）；PHIPA以同意为原则；私营企业依PIPEDA", "now_en": "Public institutions collect on statutory authority rather than consent; PHIPA is consent-based (including implied consent in some cases); private businesses follow PIPEDA.", "basis": "FIPPA s. 38(2); MFIPPA s. 28(2); PHIPA ss. 18-19; PIPEDA", "pending_zh": null, "pending_en": null, "pending_basis": null}, "breach": {"now_zh": "FIPPA机构自2025-07起按RROSH报告IPC并通知个人；PHIPA托管人须通知并报告", "now_en": "Since 1 July 2025, FIPPA institutions must report breaches meeting the real-risk-of-significant-harm threshold to the IPC and notify individuals; PHIPA custodians must notify individuals and report prescribed breaches to the IPC.", "basis": "FIPPA (as amended by Bill 194, Sch. 2); PHIPA ss. 12(2), 12(3); O. Reg. 329/04 s. 6.4", "pending_zh": "MFIPPA市级机构自2027-01-01起承担同类报告与通知义务", "pending_en": "From 1 January 2027, MFIPPA municipal institutions take on equivalent IPC-reporting and individual-notification duties.", "pending_basis": "Bill 97 (S.O. 2026, c. 2), Sch. 11 (MFIPPA)"}, "pia": {"now_zh": "FIPPA机构自2025-07起收集前须做书面PIA；PHIPA与MFIPPA暂无法定要求", "now_en": "Since 1 July 2025, FIPPA institutions must complete a written PIA before collecting personal information; PHIPA and MFIPPA have no statutory PIA duty yet (the IPC recommends one).", "basis": "FIPPA (as amended by Bill 194, Sch. 2)", "pending_zh": "MFIPPA自2027-01-01起要求收集前书面PIA，目的重大变化前须更新", "pending_en": "From 1 January 2027, MFIPPA requires a written PIA before collection, updated before a significant change in purpose.", "pending_basis": "Bill 97 (S.O. 2026, c. 2), Sch. 11 (MFIPPA)"}, "crossborder": {"now_zh": "未核实到安省通用跨境规则；私营企业依PIPEDA问责原则；IPC建议评估境外存储", "now_en": "No general Ontario cross-border transfer rule for public or health bodies was verified; private businesses rely on PIPEDA accountability; the IPC advises assessing storage outside Canada.", "basis": "PIPEDA Sch. 1 Principle 4.1.3; IPC, AI Scribes: Key Considerations (Jan 2026)", "pending_zh": null, "pending_en": null, "pending_basis": null}, "adm_ai": {"now_zh": "省部委与省属机构须遵守OPS《负责任使用AI指令》；EDSTA含AI条款但未核实到已发布AI配套法规", "now_en": "Ontario ministries and provincial agencies must follow the OPS Responsible Use of AI Directive; EDSTA contains AI provisions, but no AI regulation under it was found.", "basis": "OPS Responsible Use of Artificial Intelligence Directive (eff. 2024-12-01); EDSTA, 2024 (Bill 194, Sch. 1)", "pending_zh": null, "pending_en": null, "pending_basis": null}, "rights": {"now_zh": "公共机构依FIPPA/MFIPPA提供访问更正权；PHIPA含访问、更正及投诉权", "now_en": "Public institutions provide access and correction rights under FIPPA/MFIPPA; PHIPA gives patients access, correction and complaint rights to the IPC; private businesses follow PIPEDA.", "basis": "FIPPA; MFIPPA; PHIPA; PIPEDA", "pending_zh": "Bill 97：自2026-07-01起答复期改为45个工作日；部长及其办公室记录被排除于FIPPA之外", "pending_en": "Bill 97: from 1 July 2026 the response period is 45 business days; records of ministers and their offices are excluded from FIPPA.", "pending_basis": "Bill 97 (S.O. 2026, c. 2), Schs. 7 and 11"}, "children": {"now_zh": "无通用儿童隐私法；CYFSA第X部分规范儿童服务；学校委员会共享学生数据须书面通知", "now_en": "No general children's privacy statute; CYFSA Part X governs child-service information; since 1 July 2026 school boards must give written notice before sharing student digital data with third-party software.", "basis": "CYFSA Part X; O. Reg. 52/26 under EDSTA, 2024", "pending_zh": null, "pending_en": null, "pending_basis": null}, "security": {"now_zh": "FIPPA/PHIPA设法定保护义务；医院、高校、学校委员会等须做网安评估并报告事件", "now_en": "FIPPA contains a statutory safeguarding duty; PHIPA custodians must take reasonable safeguards; since 1 July 2026 hospitals, colleges, universities, school boards and children's aid societies must run cyber maturity assessments and report critical incidents.", "basis": "FIPPA (as amended by Bill 194, Sch. 2); PHIPA ss. 12(1), 13; O. Reg. 51/26 under EDSTA, 2024", "pending_zh": "MFIPPA自2027-01-01起扩展保护义务", "pending_en": "From 1 January 2027, MFIPPA's safeguarding obligations expand.", "pending_basis": "Bill 97 (S.O. 2026, c. 2), Sch. 11 (MFIPPA)"}, "enforcement": {"now_zh": "IPC监督三部法律；PHIPA可处行政罚款（含对个人）；FIPPA新增命令整改权", "now_en": "The IPC oversees FIPPA, MFIPPA and PHIPA; it can impose administrative monetary penalties under PHIPA, including on individuals, with several in 2026; FIPPA added power to order changes to information practices.", "basis": "PHIPA (AMP provisions); FIPPA (as amended by Bill 194, Sch. 2)", "pending_zh": "MFIPPA自2027-01-01起新增IPC审查权、举报条款及更广罪行规定", "pending_en": "From 1 January 2027, MFIPPA adds IPC review powers, a whistleblowing provision and broader offences.", "pending_basis": "Bill 97 (S.O. 2026, c. 2), Sch. 11 (MFIPPA)"}}, "items": [{"id": "on-001", "type": "ai", "title": "Principles for the Responsible Use of Artificial Intelligence (IPC–OHRC)", "title_zh": "IPC与人权委员会联合发布负责任使用AI原则", "title_short_en": "IPC–OHRC joint principles for responsible AI use", "date": "2026-01-21", "org": "IPC / Ontario Human Rights Commission", "url": "https://www.ipc.on.ca/en/media-centre/news-releases/privacy-and-human-rights-commissions-release-joint-principles-responsible-use-ai", "summary_zh": "IPC与安省人权委员会发布六项同等重要的AI原则：有效可靠、安全、保护隐私、维护人权、透明、问责。原则主要面向安省公共及广义公共部门机构，覆盖AI从设计到停用的全生命周期，并与OPS《负责任使用AI指令》对齐。", "summary_en": "The IPC and the Ontario Human Rights Commission issued six equally weighted AI principles: valid and reliable, safe, privacy-protective, human-rights affirming, transparent, and accountable. They are aimed mainly at Ontario public and broader public sector institutions, cover the full AI lifecycle from design to decommissioning, and align with the OPS Responsible Use of AI Directive.", "impact_zh": "原则属指导性文件，机构被\"强烈鼓励\"采纳。公共机构可据此建立AI治理、人工监督和人权影响评估机制，供应商也应准备说明其系统。", "impact_en": "The principles are guidance; institutions are 'strongly encouraged' to adopt them. Public bodies can use them to set up AI governance, human-in-the-loop oversight and human-rights assessment, and vendors should be ready to explain their systems.", "obligations": ["adm_ai", "accountability", "pia"], "impact_level": "high", "status_zh": null, "verified": true, "note": "Principles text also opened at ohrc.on.ca/en/principles-responsible-use-artificial-intelligence; binding status not stated on either page."}, {"id": "on-002", "type": "ai", "title": "AI Scribes: Key Considerations for the Health Sector (with companion checklist)", "title_zh": "IPC发布医疗AI记录员（AI scribe）指南", "title_short_en": "IPC guidance on AI scribes in health care", "date": "2026-01-28", "org": "IPC", "url": "https://www.ipc.on.ca/en/media-centre/news-releases/ipc-releases-new-guidance-ai-scribes-help-protect-patient-privacy", "summary_zh": "IPC在数据隐私日发布AI scribe指南及配套清单，面向开发、采购或使用AI scribe的PHIPA健康信息托管人，并特别照顾中小托管人。指南要求先建立AI治理框架、部署前做PIA、数据最小化、人工审核AI生成记录，并以明示同意为最佳做法。", "summary_en": "On Data Privacy Day the IPC released AI scribe guidance and a companion checklist for PHIPA health information custodians that develop, procure or use AI scribes, with attention to small and medium custodians. It calls for an AI governance framework, a PIA before deployment, data minimization, human review of AI-generated records, and express consent as best practice.", "impact_zh": "托管人应盘点\"影子AI\"、更新可接受使用与违规应对政策，并在供应商合同中限制数据用途、禁止无法定授权的模型训练。免费试用期同样适用PHIPA义务。", "impact_en": "Custodians should inventory 'shadow AI', update acceptable-use and breach-response policies, and restrict vendor data use in contracts, including no model training without legal authority. PHIPA duties also apply during free trials.", "obligations": ["adm_ai", "pia", "consent", "security", "accountability", "crossborder", "rights"], "impact_level": "high", "status_zh": null, "verified": true, "note": "Guidance PDF (ipc.on.ca/en/media/6177/download, dated January 2026) and checklist PDF (media/6758) opened. The resource page itself could not be fetched. The lead said ~March 2026; the IPC release is dated 28 Jan 2026."}, {"id": "on-003", "type": "legislation", "title": "O. Reg. 51/26: Cyber Security (Enhancing Digital Security and Trust Act, 2024)", "title_zh": "EDSTA网络安全条例（O. Reg. 51/26）", "title_short_en": "O. Reg. 51/26: public-sector cyber security rules", "date": "2026-03-23", "org": "Ontario", "url": "https://www.ontario.ca/page/enhancing-digital-security-and-trust-act", "summary_zh": "条例于2026-03-23提交，2026-07-01生效，适用于A/B/C级医院、渥太华大学心脏研究所、高校、学校委员会和儿童援助协会。上述机构须指定网络安全联系人、每两年做一次网络安全成熟度评估，并在确认重大网络安全事件后72小时内向省首席信息安全官报告。", "summary_en": "Filed 23 March 2026 and in force 1 July 2026, the regulation covers Group A/B/C hospitals, the University of Ottawa Heart Institute, colleges and universities, school boards and children's aid societies. They must designate cyber security contacts, run a cyber maturity assessment every two years, and report critical cyber incidents to the provincial CISO within 72 hours of confirmation.", "impact_zh": "受管机构应将72小时事件报告纳入事件响应流程；该报告不限于涉及个人信息的事件，与FIPPA/PHIPA的隐私违规报告并行。", "impact_en": "Covered entities should build the 72-hour incident report into their response plans. It is not limited to incidents involving personal information and runs in parallel with FIPPA/PHIPA breach reporting.", "obligations": ["security", "breach"], "impact_level": "high", "status_zh": "2026-07-01起施行", "verified": true, "note": "Filing date from Ontario Gazette Vol. 159, Issue 15 (11 Apr 2026). 72-hour rule and covered entities from the ontario.ca EDSTA page (updated 22 Oct 2026). The e-Laws regulation text could not be fetched.", "partial": true}, {"id": "on-004", "type": "legislation", "title": "O. Reg. 52/26: Digital Technology Affecting Individuals Under Age 18", "title_zh": "未成年人数字技术条例（O. Reg. 52/26）", "title_short_en": "O. Reg. 52/26: student data notices for school boards", "date": "2026-03-23", "org": "Ontario", "url": "https://www.ontario.ca/page/enhancing-digital-security-and-trust-act", "summary_zh": "条例于2026-03-23提交，2026-07-01生效，仅适用于学校委员会。学生个人数字信息共享给第三方软件应用时，须向家长/监护人及（视年龄）学生本人提供浅白语言的书面通知。", "summary_en": "Filed 23 March 2026 and in force 1 July 2026, the regulation applies only to school boards. When a student's personal digital information is shared with a third-party software application, the board must give plain-language written notice to parents or guardians and, depending on age, to the student.", "impact_zh": "学校委员会应盘点教育科技供应商和数据流向，建立通知模板与发送流程。", "impact_en": "School boards should inventory ed-tech vendors and data flows and set up notice templates and delivery processes.", "obligations": ["children", "rights"], "impact_level": "medium", "status_zh": "2026-07-01起施行", "verified": true, "note": "Age thresholds (under 16: parent/guardian; 16-17: student) come from a Hicks Morley article (25 Mar 2026). The ontario.ca page says only 'depending on their age'.", "partial": true}, {"id": "on-005", "type": "legislation", "title": "Bill 97, Plan to Protect Ontario Act (Budget Measures), 2026 — Schedules 7 (FIPPA) and 11 (MFIPPA)", "title_zh": "Bill 97修订FIPPA与MFIPPA", "title_short_en": "Bill 97 amends FIPPA and MFIPPA", "date": "2026-04-24", "org": "Ontario (Legislative Assembly)", "url": "https://www.ola.org/en/legislative-business/bills/parliament-44/session-1/bill-97/status", "summary_zh": "预算法案Bill 97已获御准（S.O. 2026, c. 2），附表7修订FIPPA（工作日计时、分阶段访问、数据整合、部长办公室记录排除），附表11修订MFIPPA（含PIA等隐私条款）。IPC称修订分别于2026-07-01、2026-09-15和2027-01-01生效，市级机构的新隐私义务自2027-01-01起适用。", "summary_en": "Budget bill Bill 97 received Royal Assent as S.O. 2026, c. 2. Schedule 7 amends FIPPA (business-day time limits, staged access, data integration, exclusion of ministers' office records), and Schedule 11 amends MFIPPA, including privacy provisions such as PIAs. The IPC says the amendments take effect on 1 July 2026, 15 September 2026 and 1 January 2027, with new municipal privacy duties starting 1 January 2027.", "impact_zh": "市级机构（市政府、警务、学校委员会等）应在2027-01-01前建立PIA、违规报告与通知流程；所有机构应更新访问请求处理时限。", "impact_en": "Municipal institutions (municipalities, police services, school boards and others) should have PIA and breach reporting and notification processes ready by 1 January 2027. All institutions should update their access-request timelines.", "obligations": ["pia", "breach", "security", "rights", "enforcement"], "impact_level": "high", "status_zh": "已御准；分阶段于2026-07-01、2026-09-15、2027-01-01生效", "verified": true, "note": "Royal Assent and chapter number confirmed on ola.org. The exact Royal Assent date (24 Apr 2026) comes from a WeirFoulds article, so the item date is secondary-sourced. Phase dates confirmed on IPC notice ipc.on.ca/en/node/5055; MFIPPA breach and PIA date (1 Jan 2027) confirmed on IPC breach guidelines and PIA guide pages.", "partial": true}, {"id": "on-006", "type": "decision", "title": "Response to MPP Stiles: Changes to FIPPA remove authority to investigate", "title_zh": "IPC回复Stiles：FIPPA修订使其无权调查部长记录", "title_short_en": "IPC: Bill 97 removes power to probe ministers' records", "date": "2026-04-27", "org": "IPC", "url": "https://www.ipc.on.ca/en/resources/advice-and-submissions/response-mpp-stiles-changes-fippa-remove-authority-investigate", "summary_zh": "Marit Stiles议员请IPC调查省长用私人设备处理政务，IPC回复称Bill 97修订将省长、部长、议会助理及其工作人员持有的记录排除于FIPPA之外，并追溯至1988年。因此这些记录不在IPC的法定调查权限内。", "summary_en": "MPP Marit Stiles asked the IPC to investigate the Premier's use of personal devices for government business. The IPC replied that Bill 97 excludes records held by the Premier, ministers, parliamentary assistants and their staff from FIPPA, retroactive to 1988, so they fall outside its statutory authority to investigate.", "impact_zh": "部长办公室记录不再受FIPPA访问及IPC监督；机构应厘清哪些记录仍由机构\"保管\"并继续受FIPPA约束。", "impact_en": "Ministers' office records are no longer subject to FIPPA access or IPC oversight. Institutions should clarify which records remain in their custody and therefore still under FIPPA.", "obligations": ["rights", "enforcement"], "impact_level": "medium", "status_zh": null, "verified": true, "note": "This is an IPC response letter, not a formal order; the full PDF letter was not opened."}, {"id": "on-007", "type": "decision", "title": "IPC issues second administrative monetary penalty (PHIPA)", "title_zh": "PHIPA第二笔行政罚款：医院职员窥探436份病历", "title_short_en": "Second PHIPA penalty: $2,000 for snooping 436 records", "date": "2026-04-27", "org": "IPC", "url": "https://www.ipc.on.ca/en/node/5612", "summary_zh": "IPC对一名未经授权查阅436份患者记录的医院职员个人处以2,000加元行政罚款，这是PHIPA下第二笔罚款。IPC称此案是对健康信息托管人及其代理人的警示。", "summary_en": "The IPC fined a hospital clerk personally $2,000 for accessing 436 patient records without authorization, the second administrative monetary penalty under PHIPA. The IPC called it a cautionary reminder to health information custodians and their agents.", "impact_zh": "托管人应持续做访问审计并对员工进行培训；员工个人可能被直接罚款。", "impact_en": "Custodians should keep auditing access and training staff; individual employees can be fined directly.", "obligations": ["enforcement", "security"], "impact_level": "medium", "status_zh": null, "verified": true, "note": "IPC page does not give the decision number. PHIPA Decision 334, the 23 Apr 2026 decision date and CHEO as the hospital come from secondary sources (DWW, OBA, Torkin Manes). decisions.ipc.on.ca could not be fetched.", "partial": true}, {"id": "on-008", "type": "decision", "title": "When snooping goes unchecked: Lessons from PHIPA Decision 335", "title_zh": "PHIPA第335号决定：医院窥探处置存在系统性缺陷", "title_short_en": "PHIPA Decision 335: systemic snooping-response failures", "date": "2026-08-20", "org": "IPC", "url": "https://www.ipc.on.ca/en/cases-of-note/when-snooping-goes-unchecked-lessons-phipa-decision-335", "summary_zh": "IPC审查某医院2023–2025年报告的7起窥探事件，认定医院未采取合理保护措施（PHIPA s. 12(1)），且未在第一合理时机通知受影响者（s. 12(2)）。IPC命令医院修订政策：及早决定是否暂停涉嫌人员的电子病历权限，不等调查结束即通知受影响者，并设定调查时限。", "summary_en": "The IPC reviewed seven snooping breaches a hospital reported in 2023-2025. It found the hospital failed to take reasonable safeguards (PHIPA s. 12(1)) and did not notify affected people at the first reasonable opportunity (s. 12(2)). It ordered policy changes: decide early whether to suspend a suspect's EHR access, notify affected people without waiting for investigations to end, and set investigation timelines.", "impact_zh": "暂停系统权限应视为遏制措施而非纪律处分；通知不得因内部调查或纪律程序拖延。", "impact_en": "Suspending system access is a containment step, not discipline, and notification must not wait for internal investigations or discipline.", "obligations": ["breach", "security", "enforcement"], "impact_level": "high", "status_zh": null, "verified": true, "note": "Date is the IPC case-of-note publication date; the decision's own date was not verified."}, {"id": "on-009", "type": "decision", "title": "IPC issues third administrative monetary penalty under Ontario's health privacy law (PHIPA Decision 341)", "title_zh": "PHIPA第三笔行政罚款：职员窥探675份病历罚3,000元", "title_short_en": "PHIPA Decision 341: $3,000 penalty for snooping", "date": "2026-08-26", "org": "IPC", "url": "https://www.ipc.on.ca/en/decisions/ipc-issues-third-administrative-monetary-penalty-under-ontarios-health-privacy-law", "summary_zh": "Lake of the Woods District Hospital一名临床信息职员未经授权查阅675份患者记录，被IPC命令个人缴纳3,000加元罚款，这是PHIPA下第三笔行政罚款。IPC强调托管人对防范、发现和报告未经授权访问负最终责任。", "summary_en": "A clinical information clerk at Lake of the Woods District Hospital was ordered to pay a $3,000 penalty personally for accessing 675 patient records without authorization, the third administrative monetary penalty under PHIPA. The IPC stressed that custodians bear ultimate responsibility for deterring, detecting and reporting unauthorized access.", "impact_zh": "2026年罚款频率与金额均上升；托管人应强化访问日志监控与员工问责。", "impact_en": "PHIPA penalties became more frequent and larger in 2026; custodians should tighten access-log monitoring and staff accountability.", "obligations": ["enforcement", "security"], "impact_level": "medium", "status_zh": null, "verified": true, "note": "Date is the IPC page publication date."}, {"id": "on-010", "type": "guidance", "title": "Privacy Breaches: Guidelines for Public Sector Organizations (updated)", "title_zh": "IPC更新公共部门隐私违规指引", "title_short_en": "IPC updated breach guidelines for the public sector", "date": "2026-08-13", "org": "IPC", "url": "https://www.ipc.on.ca/en/resources-and-decisions/privacy-breaches-guidelines-public-sector-organizations", "summary_zh": "IPC更新公共部门违规应对指引，说明FIPPA机构自2025-07-01、MFIPPA机构自2027-01-01须向IPC报告并通知个人。是否报告和通知以\"真实重大损害风险\"为标准判断，通知应在确定发生违规后尽快进行。", "summary_en": "The IPC updated its public-sector breach guidelines, explaining that FIPPA institutions (from 1 July 2025) and MFIPPA institutions (from 1 January 2027) must report breaches to the IPC and notify individuals. The real-risk-of-significant-harm standard decides whether to report and notify, and notice should follow as soon as feasible after a breach is determined.", "impact_zh": "市级机构应参照指引提前建立RROSH评估与报告流程。", "impact_en": "Municipal institutions should use the guidelines to set up RROSH assessment and reporting processes ahead of 2027.", "obligations": ["breach"], "impact_level": "medium", "status_zh": null, "verified": true}, {"id": "on-011", "type": "guidance", "title": "Planning for Success: Privacy Impact Assessment Guide for Ontario's public institutions (with PIA Worksheets)", "title_zh": "IPC发布公共机构PIA指南与工作表", "title_short_en": "IPC PIA guide and worksheets for public institutions", "date": "2026-08-13", "org": "IPC", "url": "https://www.ipc.on.ca/en/resources/planning-success-privacy-impact-assessment-guide-ontarios-public-institutions", "summary_zh": "IPC发布面向FIPPA和MFIPPA机构的PIA指南及可扩展工作表。指南反映FIPPA自2025-07-01、MFIPPA自2027-01-01起的法定PIA要求。", "summary_en": "The IPC published a PIA guide and expandable worksheets for FIPPA and MFIPPA institutions. They reflect the statutory PIA requirements under FIPPA (from 1 July 2025) and MFIPPA (from 1 January 2027).", "impact_zh": "机构可用该工作表记录PIA；IPC有权索取PIA，留存完整记录很重要。", "impact_en": "Institutions can use the worksheets to document PIAs. The IPC can request PIAs, so complete records matter.", "obligations": ["pia"], "impact_level": "medium", "status_zh": null, "verified": true, "note": "IPC's power to request any PIA (under MFIPPA as amended) is from a WeirFoulds article, not this page.", "partial": true}, {"id": "on-012", "type": "guidance", "title": "Guidance on Police Use of Remotely Piloted Aircraft Systems (Drones) in Ontario", "title_zh": "IPC发布警方使用无人机隐私指南", "title_short_en": "IPC guidance on police use of drones", "date": "2026-08-17", "org": "IPC", "url": "https://www.ipc.on.ca/en/resources/guidance-police-use-remotely-piloted-aircraft-systems-drones-ontario", "summary_zh": "IPC就警方部署无人机（RPAS）前、中、后应考虑的隐私与透明度事项发布指南。IPC认为在适当透明和问责下以保护隐私的方式使用，有助于警方维持公众信任。", "summary_en": "The IPC issued guidance on the privacy and transparency points police services should consider before, during and after deploying drones (RPAS). It says privacy-protective use with appropriate transparency and accountability can help police keep public trust.", "impact_zh": "警务机构部署无人机前应对照指南评估隐私影响与公开透明安排。", "impact_en": "Police services should check drone deployments against the guidance for privacy impact and public transparency before launch.", "obligations": ["pia", "accountability"], "impact_level": "low", "status_zh": null, "verified": true, "note": "Only the landing page was opened; the specific recommendations in the PDF were not reviewed."}, {"id": "on-013", "type": "legislation", "title": "Notice of Proposed Regulation under PHIPA: amendment to O. Reg. 329/04 (Digital Health Identifier)", "title_zh": "PHIPA条例修订草案：扩展数字健康标识符用途", "title_short_en": "Proposed PHIPA rule to widen Digital Health ID use", "date": "2026-08-22", "org": "Ontario (Ministry of Health)", "url": "https://www.ontario.ca/document/ontario-gazette-volume-159-issue-34-august-22-2026", "summary_zh": "卫生部在安省公报刊登O. Reg. 329/04修订草案，拟允许民众用数字健康标识符访问更多面向患者的数字健康资源。征求意见期为2026-08-22至2026-10-21。", "summary_en": "The Ministry of Health published a draft amendment to O. Reg. 329/04 in the Ontario Gazette that would let Ontarians use the Digital Health Identifier to reach more patient-facing digital health resources. Comments were open from 22 August to 21 October 2026.", "impact_zh": "数字健康服务提供方应关注最终条例文本及其生效日期。", "impact_en": "Digital health service providers should watch for the final regulation text and its in-force date.", "obligations": ["rights", "security"], "impact_level": "low", "status_zh": "草案阶段，征求意见已于2026-10-21结束，尚未提交", "verified": true}, {"id": "on-014", "type": "ai", "title": "Beyond the Initial Agreement: How Privacy Drift Affects Modern Third-Party Contracting", "title_zh": "IPC研究中心发布\"隐私漂移\"与第三方合同报告", "title_short_en": "Privacy drift and shadow AI in vendor contracts", "date": "2026-10-07", "org": "IPC (Research & Innovation Hub; authored by CIPPIC)", "url": "https://www.ipc.on.ca/en/resources/research-hub/beyond-initial-agreement-how-privacy-drift-affects-modern-third-party-contracting", "summary_zh": "报告研究公共部门第三方合同中的\"隐私漂移\"，即隐私相关权利义务因合同变更或企业控制不足而逐渐扩张或改变。报告指出员工使用未经批准的AI工具（影子AI）会加速漂移并绕过机构的数据治理。", "summary_en": "The paper examines 'privacy drift' in public-sector third-party contracts: the gradual expansion or change of privacy rights and obligations through contract changes or weak enterprise controls. It notes that staff use of unsanctioned AI tools ('shadow AI') can speed this up and bypass an organization's data governance.", "impact_zh": "机构应定期复核供应商条款变更并管控员工使用未批准的AI工具。", "impact_en": "Institutions should periodically review vendor term changes and control staff use of unapproved AI tools.", "obligations": ["accountability", "adm_ai", "security"], "impact_level": "low", "status_zh": null, "verified": true, "note": "Views are the authors' (CIPPIC), not necessarily the IPC's. Only the landing page was opened, not the full PDF."}, {"id": "news-007", "type": "news", "title": "Ontario Superior Court orders Toronto plastic surgeon to pay $22.5M in class action damages", "title_short_en": "$22.5M award for hidden clinic cameras", "title_zh": "诊所暗设摄像头案判赔2,250万元", "date": "2026-05-26", "org": "Ontario Superior Court of Justice (reported by Canadian Lawyer)", "url": "https://www.canadianlawyermag.com/practice-areas/medical-malpractice/ontario-superior-court-orders-toronto-plastic-surgeon-to-pay-225m-in-class-action-damages/394174", "summary_en": "In J.C. v. Jugenburg, 2026 ONSC 3061, Justice Schabas held a Toronto plastic surgeon and his clinic liable for negligence, breach of fiduciary duty and intrusion upon seclusion for operating 24 cameras in patient, staff and treatment areas without patients' knowledge or consent. The court awarded $21.5 million in aggregate damages for intrusion upon seclusion and $1 million in punitive damages, without individual proof of harm.", "summary_zh": "在J.C. v. Jugenburg案（2026 ONSC 3061）中，Schabas法官认定多伦多一名整形外科医生及其诊所在患者不知情、未同意的情况下于患者区、员工区和治疗区运行24个摄像头，构成过失、违反信义义务和侵扰私人生活（intrusion upon seclusion）。法院判处侵扰私人生活总额赔偿2,150万元及惩罚性赔偿100万元，无需个人逐一证明损害。", "impact_en": "Covert surveillance of patients can support large class-wide damages for intrusion upon seclusion; health and service providers should review camera use, signage and purpose limits.", "impact_zh": "对患者的隐蔽监控可导致基于侵扰私人生活的大额集体赔偿；医疗及服务机构应审查摄像头使用、告示和目的限制。", "obligations": ["consent", "accountability", "enforcement"], "impact_level": "high", "verified": true, "note": "Decision date (May 26, 2026) and class size (~7,000) come from class counsel's website (hshlawyers.com); Canadian Lawyer (2026-06-04) does not state the date.", "partial": true}, {"id": "news-008", "type": "news", "title": "Notice of Security Incident", "title_short_en": "WRHN: incident on Health Report Manager link", "title_zh": "滑铁卢区域医疗网络安全事件", "date": "2026-02-20", "org": "Waterloo Regional Health Network", "url": "https://www.wrhn.ca/?p=7628", "summary_en": "Waterloo Regional Health N
