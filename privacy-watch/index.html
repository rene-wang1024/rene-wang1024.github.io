etwork said OntarioMD notified it on February 6, 2026 of a security incident affecting its connection to the Health Report Manager, an Ontario Health-hosted tool that sends hospital-care information to patients' primary care providers. WRHN said the incident occurred outside its own and Ontario Health's networks, was contained, and was reported to the IPC as a precaution.", "summary_zh": "滑铁卢区域医疗网络（WRHN）称，OntarioMD于2026年2月6日通知其发生一起安全事件，影响WRHN与Health Report Manager的连接；该工具由Ontario Health托管，用于向患者的初级保健医生发送住院诊疗信息。WRHN表示事件发生在其自身及Ontario Health网络之外，已得到控制，并已作为预防措施报告IPC。", "impact_en": "Shared provincial health-information tools create third-party exposure for every connected custodian; contracts and incident plans should cover who notifies patients and the IPC.", "impact_zh": "省级共享健康信息工具使每个接入的信息托管人都面临第三方风险；合同和事件预案应明确由谁通知患者和IPC。", "obligations": ["breach", "security", "accountability"], "impact_level": "medium", "verified": true, "note": "Scale is from a secondary report: Observer Xtra (2026-04-16) says about 150,000 patients who received care between April 2025 and January 2026 may have had information accessed, contained January 13. Not confirmed on the WRHN notice.", "partial": true}, {"id": "news-009", "type": "news", "title": "How a ransomware attack left an Ontario government health agency scrambling", "title_short_en": "Ontario Health atHome vendor ransomware details", "title_zh": "安省居家护理机构供应商勒索软件事件内幕", "date": "2026-03-11", "org": "Global News", "url": "https://globalnews.ca/news/11724707/ontario-health-athome-ransomware-details/", "summary_en": "Records obtained through freedom-of-information requests show weeks of confusion after ransomware hit Ontario Medical Supply, a vendor to Ontario Health atHome, in April 2025; about 200,000 home care patients were affected based on the vendor's estimate. A government report says the vendor paid the ransom, and the vendor confirmed health data had been taken despite earlier describing the threat as contained.", "summary_zh": "通过信息公开申请获得的记录显示，2025年4月Ontario Health atHome的供应商Ontario Medical Supply遭勒索软件攻击后，相关方数周内陷入混乱；按供应商估计约20万名居家护理患者受影响。政府报告称该供应商支付了赎金，而供应商在早先称威胁已被控制后，确认健康数据已被窃取。", "impact_en": "Public bodies remain accountable for vendor incidents; contracts should require timely, specific breach reporting and allow the body to disconnect and verify a vendor before reconnecting.", "impact_zh": "公共机构须对供应商事件承担问责；合同应要求及时、具体的泄露报告，并允许机构断开连接并在核实后再恢复。", "obligations": ["accountability", "breach", "security"], "impact_level": "medium", "verified": true, "note": "The incident itself occurred in April 2025; included because the details were first reported on 2026-03-11."}]}, {"jurisdiction": "quebec", "checked_at": "2026-10-25", "baseline": {"accountability": {"now_zh": "企业对其持有的个人信息负责；最高负责人默认担任隐私负责人，须制定并公开治理政策。", "now_en": "The enterprise is responsible for the personal information it holds; its highest-ranking person is the privacy officer by default, and it must adopt and publish governance policies.", "basis": "P-39.1 s. 3.1, 3.2", "pending_zh": "CAI五年报告建议：在法律中明确规定“必要性”测试，并适用于数据全生命周期（仅为建议，非法案）。", "pending_en": "CAI five-year report recommends codifying the necessity test and applying it across the data lifecycle (recommendation only, not a bill).", "pending_basis": "CAI 2026 five-year report (recommendation, not a bill), Rec. 30-31"}, "consent": {"now_zh": "同意须明示、自由、知情并针对特定目的；敏感信息的二次使用须明示同意。", "now_en": "Consent must be manifest, free, informed and given for specific purposes; express consent is required for secondary use of sensitive information.", "basis": "P-39.1 s. 8, 12, 14", "pending_zh": "CAI建议：明确禁止“诱导式界面”，承认自动化同意信号（默认拒绝）（仅为建议）。", "pending_en": "CAI recommends an explicit ban on deceptive interfaces and recognition of automated consent signals with refusal as the default (recommendation only).", "pending_basis": "CAI 2026 five-year report (recommendation, not a bill), Rec. 27, 55"}, "breach": {"now_zh": "发生有严重损害风险的保密事件时，须及时通知CAI及受影响个人，并保存事件登记册。", "now_en": "Where a confidentiality incident presents a risk of serious harm, the enterprise must promptly notify the CAI and affected persons, and keep an incident register.", "basis": "P-39.1 s. 3.5, 3.6, 3.8", "pending_zh": null, "pending_en": null, "pending_basis": null}, "pia": {"now_zh": "获取、开发或重构涉及个人信息的信息系统或电子服务时，须进行隐私影响评估（EFVP）。", "now_en": "A privacy impact assessment (EFVP) is required for acquiring, developing or redesigning information systems or electronic services involving personal information.", "basis": "P-39.1 s. 3.3", "pending_zh": "CAI建议：涉及AI自动化决策时，EFVP应包含算法影响分析；未做EFVP应列为可处罚违规（仅为建议）。", "pending_en": "CAI recommends that an EFVP include an algorithmic impact analysis for AI systems making automated decisions, and that failing to do a required EFVP become a specific sanctionable breach (recommendation only).", "pending_basis": "CAI 2026 five-year report (recommendation, not a bill), Rec. 45, 52"}, "crossborder": {"now_zh": "向魁北克省外传输个人信息前，须先做隐私影响评估并签订书面协议。", "now_en": "Before communicating personal information outside Québec, the enterprise must conduct a privacy impact assessment and sign a written agreement.", "basis": "P-39.1 s. 17", "pending_zh": null, "pending_en": null, "pending_basis": null}, "adm_ai": {"now_zh": "完全基于自动化处理作出的决定须告知当事人，当事人可要求解释并向可复核人员提出意见。", "now_en": "A person must be informed of a decision based exclusively on automated processing, and may request an explanation and submit observations to staff able to review the decision.", "basis": "P-39.1 s. 12.1", "pending_zh": "CAI建议：将画像推断明确纳入个人信息定义，并将“创建/推断信息”视为收集（仅为建议）。", "pending_en": "CAI recommends expressly including profiling inferences in the definition of personal information and treating creation or inference of information as collection (recommendation only).", "pending_basis": "CAI 2026 five-year report (recommendation, not a bill), Rec. 33, 35-36"}, "rights": {"now_zh": "个人享有查阅、更正、可携带（结构化常用格式）及停止传播/去索引等权利；企业须在30日内答复。", "now_en": "Individuals have rights of access, rectification, portability (structured, commonly used format) and cessation of dissemination or de-indexing; the enterprise must respond within 30 days.", "basis": "P-39.1 s. 27, 28.1, 32", "pending_zh": "CAI建议：使组织答复请求的期限成为严格期限，逾期失权（仅为建议）。", "pending_en": "CAI recommends making organizations' response deadlines strict, with forfeiture if missed (recommendation only).", "pending_basis": "CAI 2026 five-year report (recommendation, not a bill), Rec. 11"}, "children": {"now_zh": "未经父母或监护人同意，不得直接向14岁以下儿童收集个人信息（明显有利于儿童的除外）。", "now_en": "Personal information about a child under 14 may not be collected from the child without parental or tutor consent, unless the collection is clearly for the child's benefit.", "basis": "P-39.1 s. 4.1", "pending_zh": "CAI建议：对14岁以下儿童的算法推断须经监护人同意，禁止针对未成年人的画像广告及出售其信息（仅为建议）。", "pending_en": "CAI recommends parental consent for algorithmic inferences about children under 14, and bans on profiling-based advertising to minors and on selling minors' information (recommendation only).", "pending_basis": "CAI 2026 five-year report (recommendation, not a bill), Rec. 37, 57"}, "security": {"now_zh": "须采取与信息敏感性、目的、数量、分布和载体相称的安全措施；技术产品默认最高隐私设置。", "now_en": "Security measures must be reasonable given the sensitivity, purpose, quantity, distribution and medium of the information; technology products must default to the highest privacy settings.", "basis": "P-39.1 s. 9.1, 10", "pending_zh": null, "pending_en": null, "pending_basis": null}, "enforcement": {"now_zh": "CAI可对企业处以行政罚款，上限为1000万加元或全球营业额2%中的较高者；经批准并履行的整改承诺可免罚。", "now_en": "The CAI can impose administrative monetary penalties of up to the greater of $10 million or 2% of worldwide turnover; an approved and respected undertaking bars a penalty for the acts it covers.", "basis": "P-39.1 (administrative monetary penalty regime); CAI Cadre général d'application des SAP, s. 3.4.3–3.4.4", "pending_zh": "CAI建议：行政罚款仅限客观性违规并增加新的客观违规类型（仅为建议）。", "pending_en": "CAI recommends limiting administrative monetary penalties to objective breaches and adding objective breaches not now covered (recommendation only).", "pending_basis": "CAI 2026 five-year report (recommendation, not a bill), Rec. 74"}}, "items": [{"id": "qc-001", "type": "decision", "title": "Mise en ligne des décisions rendues par la section de surveillance", "title_zh": "CAI监督部门决定重新在线公开", "title_short_en": "CAI oversight-division decisions published online again", "date": "2026-01-13", "org": "CAI", "url": "https://www.cai.gouv.qc.ca/actualites/mise-en-ligne-decisions-rendues-par-section-de-surveillance", "summary_zh": "CAI宣布其监督部门（section de surveillance）作出的决定重新在官网公开。公告本身未包含具体案件内容。", "summary_en": "The CAI announced that decisions of its oversight (surveillance) division are again available on its website. The notice itself contains no case details.", "impact_zh": "合规团队可定期查阅该决定列表，跟踪CAI对收集必要性、治理政策等问题的认定。", "impact_en": "Compliance teams can monitor this list to track how the CAI applies necessity, governance and other requirements.", "obligations": ["enforcement"], "impact_level": "low", "status_zh": null, "status_en": null, "verified": true, "note": "Decision list page: https://www.cai.gouv.qc.ca/commission-acces-information/acces-information-de-la-commission/decisions-de-commission-section-surveillance"}, {"id": "qc-002", "type": "guidance", "title": "Prévention des incidents de confidentialité : deux nouveaux outils", "title_zh": "预防保密事件：两项新工具", "title_short_en": "Preventing confidentiality incidents: two new CAI tools", "date": "2026-01-30", "org": "CAI", "url": "https://www.cai.gouv.qc.ca/actualites/prevention-des-incidents-de-confidentialite-deux-nouveaux-outils", "summary_zh": "在2026年数据保护周期间，CAI发布面向企业的两份资料：一份预防保密事件的说明指南和一份良好做法检查清单。", "summary_en": "During Data Protection Week 2026, the CAI published two resources for businesses: an explanatory guide on preventing confidentiality incidents and a good-practice checklist.", "impact_zh": "企业可用该清单自查安全措施和事件应对流程，与第3.5条通知义务和事件登记册要求配套使用。", "impact_en": "Businesses can use the checklist to review security measures and incident response, alongside the s. 3.5 notification duty and incident register.", "obligations": ["breach", "security"], "impact_level": "medium", "status_zh": null, "status_en": null, "verified": true}, {"id": "qc-003", "type": "decision", "title": "Commission d'accès à l'information c. METRO inc., dossier 1037199-S", "title_zh": "Metro人脸识别试点：CAI认定收集必要但须定期报告", "title_short_en": "Metro facial recognition pilot: CAI decision 1037199-S", "date": "2026-04-01", "org": "CAI", "url": "https://www.cai.gouv.qc.ca/uploads/pdfs/decisions-en-surveillance/1037199-S_decision-cai-metro-inc-2026-04-01.pdf", "summary_zh": "Metro计划在约十家门店试点人脸识别，以识别曾涉盗窃、欺诈或暴力的人员；CAI认定人脸图像和生物特征模板属个人信息，且该收集符合第5条必要性要求。CAI未处罚款，但建议评估按地区集中数据的必要性，并命令其两年内每六个月报告系统运行、误报和偏差情况。", "summary_en": "Metro planned a facial recognition pilot in about ten stores to identify people previously involved in theft, fraud or violence; the CAI found the facial images and biometric templates are personal information and that the collection met the s. 5 necessity test. No penalty was imposed, but the CAI recommended reviewing regional data centralization and ordered six-monthly reports for two years on effectiveness, false positives and bias.", "impact_zh": "部署生物识别或人脸识别的企业应记录必要性论证、准确率及偏差测试，并预期CAI可能要求持续报告。该决定与2025年2月依《信息技术法律框架法》第44条作出、目前在魁北克法院受到质疑的决定并存。", "impact_en": "Businesses deploying biometrics or facial recognition should document necessity, accuracy and bias testing, and expect possible ongoing reporting duties. This decision sits alongside a February 2025 decision under s. 44 of the IT legal framework act (LCCJTI) that is being challenged before the Cour du Québec.", "obligations": ["accountability", "adm_ai", "security"], "impact_level": "high", "status_zh": null, "status_en": null, "verified": true}, {"id": "qc-004", "type": "ai", "title": "Résultats de l'enquête conjointe sur OpenAI – ChatGPT en matière de protection des renseignements personnels", "title_zh": "OpenAI/ChatGPT联合调查结果", "title_short_en": "Joint investigation of OpenAI ChatGPT: results", "date": "2026-05-06", "org": "CAI, OPC, OIPC BC, OIPC Alberta", "url": "https://www.cai.gouv.qc.ca/uploads/pdfs/CAI_CO_2026-05-06_OpenAI.pdf", "summary_zh": "CAI与联邦、BC省和阿尔伯塔省隐私监管机构联合调查认定，OpenAI最初训练和部署ChatGPT的方式不符合隐私法；CAI认定OpenAI未完全履行魁北克私营部门法下的义务。CAI提出四项建议（非命令），包括默认不将用户对话用于模型训练、告知免费用户对话可能被审阅和用于训练。", "summary_en": "The CAI and the federal, BC and Alberta privacy regulators found that the way OpenAI initially trained and deployed ChatGPT did not comply with privacy law; the CAI found OpenAI did not fully meet its Québec private-sector obligations. The CAI made four recommendations (not orders), including not using user chats for training by default and informing free users that chats may be reviewed and used for training.", "impact_zh": "开发或使用生成式AI的企业应评估训练数据收集的必要性、通知与同意机制，以及训练用途的默认设置。联邦报告显示CAI认为居住地即构成适用魁北克法律的充分连接因素。", "impact_en": "Organizations building or using generative AI should review the necessity of training-data collection, notice and consent, and default settings for training use. Per the federal report, the CAI treats residence in Québec as a sufficient connecting factor for its law to apply.", "obligations": ["consent", "accountability", "rights", "adm_ai"], "impact_level": "high", "status_zh": null, "status_en": null, "verified": true, "note": "Full joint report (OPC): https://www.priv.gc.ca/en/opc-actions-and-decisions/investigations/investigations-into-businesses/2026/pipeda-2026-002/ (CAI found contravention of s. 5 for GPT-3.5/GPT-4 training data, para. 105)"}, {"id": "qc-005", "type": "decision", "title": "Décision CAI, Gestion immobilière Vesta inc., dossier 1036011-S", "title_zh": "物业公司Vesta：过度收集社保号和驾照信息被命令整改", "title_short_en": "Vesta property manager: over-collection of SIN and licences", "date": "2026-05-27", "org": "CAI", "url": "https://www.cai.gouv.qc.ca/uploads/pdfs/decisions-en-surveillance/1036011-S_decision-cai_gestion-immobiliere-vesta-inc-2026-05-27.pdf", "summary_zh": "CAI认定加蒂诺的住宅物业管理公司在租约转让申请中无正当理由收集社会保险号和驾照副本及号码，并因申请人拒绝提供而拒绝其申请，违反第3.1、3.2、5、8.2和9条。CAI命令其停止相关收集、在30日内删除或遮盖无正当理由收集的社保号、建立并实施治理政策、在网上公布隐私信息，并在90日内报告整改情况，未处罚款。", "summary_en": "The CAI found a Gatineau residential property manager collected SINs and copies and numbers of driver's licences without justification for lease assignment applications, and refused applicants who declined, contravening ss. 3.1, 3.2, 5, 8.2 and 9. It ordered the company to stop the collection, redact or destroy unjustified SINs, adopt governance policies and publish privacy information within 30 days, and report on the measures within 90 days; no fine was imposed.", "impact_zh": "房东和物业公司应审查租客筛查表格，仅收集必要信息，并在网站公布隐私政策和隐私负责人联系方式。", "impact_en": "Landlords and property managers should review tenant screening forms, collect only what is necessary, and publish a privacy policy and privacy officer contact details online.", "obligations": ["accountability", "consent", "security"], "impact_level": "medium", "status_zh": null, "status_en": null, "verified": true}, {"id": "qc-006", "type": "legislation", "title": "Rapport quinquennal 2026 – Transparence et vie privée : protéger la démocratie à l'ère numérique", "title_zh": "CAI 2026年五年期报告：74项修法建议", "title_short_en": "CAI 2026 five-year report: 74 law-reform recommendations", "date": "2026-06-11", "org": "CAI", "url": "https://www.cai.gouv.qc.ca/actualites/publication-du-rapport-quinquennal-2026-de-la-commission", "summary_zh": "CAI的五年期报告由负责信息公开和个人信息保护的部长Jean-François Roberge提交国民议会，包含74项建议。私营部门相关建议包括：将画像推断纳入个人信息定义、EFVP纳入算法影响分析、加强儿童保护、将生物识别规则移入一般隐私法、限定行政罚款范围。", "summary_en": "The CAI's five-year report, tabled in the National Assembly by Jean-François Roberge, the minister responsible for access to information and privacy, contains 74 recommendations. Private-sector proposals include adding profiling inferences to the definition of personal information, algorithmic impact analysis in EFVPs, stronger protection for children, moving biometric rules into general privacy law, and narrowing the scope of administrative monetary penalties.", "impact_zh": "这些仅为建议，不改变现行义务；企业可关注政府是否据此提出修法法案，尤其是AI推断、儿童和生物识别方面。", "impact_en": "These are recommendations only and do not change current obligations; watch whether the government introduces a bill based on them, especially on AI inferences, children and biometrics.", "obligations": ["adm_ai", "children", "pia", "consent", "enforcement"], "impact_level": "high", "status_zh": "监管机构建议，已提交国民议会；尚未形成法案", "status_en": "Regulator recommendations tabled in the National Assembly; no bill introduced (as verified)", "verified": true, "note": "Recommendation details from abridged report: https://www.cai.gouv.qc.ca/uploads/pdfs/CAI_RQ_2026_Res.pdf", "partial": true}, {"id": "qc-007", "type": "guidance", "title": "Communiqué du 16 septembre 2026 – Rencontre annuelle des régulateurs en accès à l'information et protection des renseignements personnels", "title_zh": "联邦/省/地区隐私与信息监管机构年度会议", "title_short_en": "Annual FPT privacy and access regulators meeting", "date": "2026-09-16", "org": "CAI (with FPT commissioners)", "url": "https://www.cai.gouv.qc.ca/uploads/pdfs/CAI_Communique_FPT_2026.pdf", "summary_zh": "联邦、各省和地区的信息与隐私专员在渥太华举行年度会议，讨论人工智能、量子计算、跨境数据流动和数字主权等议题。CAI主席Lise Girard介绍了2026年五年期报告的后续步骤；新闻稿未提及联合决议。", "summary_en": "Federal, provincial and territorial information and privacy commissioners met in Ottawa to discuss AI, quantum computing, cross-border data flows and digital sovereignty. CAI President Lise Girard presented next steps for the 2026 five-year report; the release mentions no joint resolution.", "impact_zh": "跨境数据流动和数字主权已成为监管机构共同关注点，跨省运营企业可留意后续协调行动。", "impact_en": "Cross-border data flows and digital sovereignty are shared regulator priorities; organizations operating across provinces should watch for coordinated follow-up.", "obligations": ["crossborder", "adm_ai"], "impact_level": "low", "status_zh": null, "status_en": null, "verified": true}, {"id": "qc-008", "type": "legislation", "title": "Rapport quinquennal : Expliciter le critère de nécessité dans les lois pour protéger la vie privée", "title_zh": "五年期报告：在法律中明确“必要性”标准", "title_short_en": "Five-year report: make the necessity test explicit in law", "date": "2026-10-13", "org": "CAI", "url": "https://www.cai.gouv.qc.ca/actualites/rapport-quinquennal-expliciter-le-critere-de-necessite-lois-proteger-vie-privee", "summary_zh": "CAI指出“必要性”标准在适用中存在多重障碍，该标准限制个人信息的收集、使用、披露和保留。CAI建议在法律中明确规定必要性测试及其适用范围，并通过更清晰的指引便于适用。", "summary_en": "The CAI identifies several obstacles to applying the necessity criterion, which limits the collection, use, disclosure and retention of personal information. It recommends writing the necessity test and its scope into law and issuing clearer guidance to apply it.", "impact_zh": "企业现在就应为每项收集和处理活动记录必要性论证，这也是CAI在2026年决定中的审查重点。", "impact_en": "Businesses should already document a necessity rationale for each collection and processing activity, a key point in the CAI's 2026 decisions.", "obligations": ["accountability", "consent"], "impact_level": "medium", "status_zh": "监管机构建议，尚未形成法案", "status_en": "Regulator recommendation; no bill introduced (as verified)", "verified": true}, {"id": "qc-009", "type": "decision", "title": "Clearview AI : l'ordonnance de la Commission confirmée par la Cour du Québec", "title_zh": "魁北克法院维持CAI对Clearview AI的命令", "title_short_en": "Cour du Québec upholds CAI order against Clearview AI", "date": "2026-10-16", "org": "Cour du Québec / CAI", "url": "https://www.cai.gouv.qc.ca/actualites/clearview-ai-lordonnance-de-la-commission-confirmee-par-la-cour-du-quebec", "summary_zh": "魁北克法院驳回Clearview AI的上诉理由，认定其与魁北克存在真实且实质的联系、其图像收集不具严肃合法利益，且私营部门法的同意要求未不当限制其言论自由。CAI于2021年12月命令Clearview停止收集魁北克人的个人信息，并销毁其图像和生物特征标识。", "summary_en": "The Cour du Québec rejected Clearview AI's appeal grounds, finding a real and substantial connection to Québec, no serious and legitimate interest for its image collection, and that the Act's consent rules do not unjustly limit its freedom of expression. The CAI's December 2021 order required Clearview to stop collecting Quebecers' personal information and destroy their images and biometric identifiers.", "impact_zh": "境外企业抓取公开网络图像用于人脸识别时，仍可能受魁北克法律管辖，需取得同意。", "impact_en": "Foreign companies that scrape public web images for facial recognition can still be subject to Québec law and need consent.", "obligations": ["consent", "enforcement", "adm_ai"], "impact_level": "high", "status_zh": null, "status_en": null, "verified": true, "note": "Date is the CAI news date; the judgment date and court file number were not stated on the CAI page and were not verified. CAI order file 1023158-S (2021-12-14)."}, {"id": "qc-010", "type": "guidance", "title": "Les interfaces truquées : un obstacle à la protection des renseignements personnels", "title_zh": "诱导式界面（暗黑模式）新指引页面", "title_short_en": "Deceptive interfaces: new CAI guidance page", "date": "2026-10-22", "org": "CAI", "url": "https://www.cai.gouv.qc.ca/actualites/interfaces-truquees-obstacle-protection-renseignements-personnels", "summary_zh": "CAI发布关于“诱导式界面”的新页面，指这类设计（无论有意与否）会引导用户作出不利于自身的选择，例如分享更多个人信息。CAI指出这类界面可能使同意无效，进而导致相关使用和披露违法。", "summary_en": "The CAI published a new page on deceptive interfaces, designs that, intentionally or not, push users toward choices against their interest, such as sharing more personal information. The CAI says such interfaces can invalidate consent, making the resulting uses and disclosures unlawful.", "impact_zh": "企业应检查同意弹窗、注册流程和隐私设置的界面设计，确保拒绝与同意同样容易。", "impact_en": "Businesses should review consent banners, sign-up flows and privacy settings so that refusing is as easy as accepting.", "obligations": ["consent"], "impact_level": "medium", "status_zh": null, "status_en": null, "verified": true, "note": "Guidance page: https://www.cai.gouv.qc.ca/protection-renseignements-personnels/sujets-et-domaines-dinteret/interfaces-truquees"}, {"id": "qc-011", "type": "guidance", "title": "Semaine de la protection des données 2026", "title_zh": "2026年数据保护周：CAI聚焦青少年、医疗与AI", "title_short_en": "Data Protection Week 2026: CAI priorities", "date": "2026-01-26", "org": "CAI", "url": "https://www.cai.gouv.qc.ca/actualites/semaine-protection-des-donnees-2026", "summary_zh": "CAI在2026年1月26日至30日数据保护周每日发布资讯，主题包括企业个人信息保护、招聘中的个人信息保护和预防保密事件。CAI主席Lise Girard表示将重点关注青少年隐私、医疗与社会服务以及人工智能。", "summary_en": "For Data Protection Week (26-30 January 2026), the CAI published daily capsules on topics including privacy in business, privacy in recruitment and incident prevention. CAI President Lise Girard said the CAI will focus on youth privacy, health and social services, and AI.", "impact_zh": "处理青少年数据或使用AI的企业可预期CAI加强关注；招聘环节的个人信息收集也值得复查。", "impact_en": "Organizations handling youth data or using AI can expect closer CAI attention; recruitment data collection is also worth reviewing.", "obligations": ["children", "adm_ai", "breach"], "impact_level": "low", "status_zh": null, "status_en": null, "verified": true}, {"id": "qc-012", "type": "ai", "title": "Guide sur l'utilisation responsable de l'intelligence artificielle agentique", "title_zh": "魁北克政府：公共机构负责任使用代理式AI指南", "title_short_en": "Québec guide on responsible agentic AI (public bodies)", "date": null, "org": "Ministère de la Cybersécurité et du Numérique (Québec)", "url": "https://cdn-contenu.quebec.ca/cdn-contenu/adm/min/cybersecurite_numerique/Intelligence_artificielle/GU_IA_Agentique.pdf", "summary_zh": "魁北克网络安全与数字部发布面向公共机构的代理式AI指南，要求在代理使用个人信息时视需要进行隐私影响评估，并遵循最小权限和数据最小化。代理使用个人或机密信息、与第三方沟通或处理有争议情形时，须有人工监督，且日志不得被代理修改。", "summary_en": "Québec's Ministry of Cybersecurity and Digital Technology issued a guide for public bodies on agentic AI, calling for a privacy impact assessment where required when an agent uses personal information, least privilege and data minimization. Human oversight is required when an agent uses personal or confidential information, communicates with third parties or handles contentious cases, and logs must be beyond the agent's control.", "impact_zh": "该指南适用于公共机构，对私营企业无约束力，但可作为设计AI代理人工监督与日志机制的参考。", "impact_en": "The guide targets public bodies and does not bind businesses, but it is a useful reference for human oversight and logging in AI agents.", "obligations": ["adm_ai", "pia", "security"], "impact_level": "low", "status_zh": null, "status_en": null, "verified": false, "note": "Document opened and content verified, but it states no publication date (only '© Gouvernement du Québec, 2026'), so the in-scope date could not be confirmed. Undated guide (© 2026)."}, {"id": "news-010", "type": "news", "title": "Option Consommateurs c. Home Depot of Canada inc.", "title_short_en": "Court of Appeal widens Home Depot–Meta class", "title_zh": "上诉法院扩大Home Depot向Meta共享数据集体诉讼", "date": "2026-02-13", "org": "Court of Appeal of Quebec", "url": "https://courdappelduquebec.ca/en/judgments/judgment?tx_news_pi1%5Baction%5D=detail&tx_news_pi1%5Bcontroller%5D=News&tx_news_pi1%5Bnews%5D=784&cHash=912d11eba21b4aa77de76f34d5ba63f4", "summary_en": "The Court of Appeal partly allowed Option consommateurs' appeal in its proposed class action alleging Home Depot shared customers' email-receipt information with Facebook without consent, adding online purchasers to the class and finding it arguable that the shared email addresses had monetary value. It held that treating Home Depot's privacy statement as proof of consent was a merits question, and upheld the exclusion of people without a Facebook account.", "summary_zh": "魁北克上诉法院部分支持Option consommateurs的上诉。该集体诉讼指控Home Depot未经同意将客户电子收据相关信息共享给Facebook；法院将网上购物者纳入集体，并认为被共享的电子邮箱具有金钱价值这一主张具有可争辩性。法院认为把Home Depot的隐私声明视为同意的证据属于实体问题，同时维持了将无Facebook账户者排除在外的决定。", "impact_en": "Sharing customer identifiers with advertising platforms is a live class-action risk in Québec; a general privacy statement may not be enough to show consent for targeted-advertising uses.", "impact_zh": "向广告平台共享客户标识符在魁北克存在现实的集体诉讼风险；一般性的隐私声明可能不足以证明对定向广告用途的同意。", "obligations": ["consent", "crossborder"], "impact_level": "high", "verified": true, "note": "Authorization-stage ruling; allegations are not proven. Neutral citation not shown on the court page (secondary sources cite 2026 QCCA 149).", "partial": true}, {"id": "news-011", "type": "news", "title": "Paquin-Charbonneau et Mélançon-Gaudreault c. Innomar Strategies inc. et Cencora inc. — jugement d'autorisation", "title_short_en": "Class action authorized over Cencora/Innomar breach", "title_zh": "Cencora/Innomar数据泄露集体诉讼获准", "date": "2026-07-16", "org": "Superior Court of Québec (Registre des actions collectives)", "url": "https://www.registredesactionscollectives.quebec/fr/Fichier/Document?NomFichier=17258.pdf", "summary_en": "Justice Martin F. Sheehan authorized a class action on behalf of people in Québec whose information held by Innomar Strategies and its parent Cencora was exfiltrated on or about February 21, 2024. Innomar runs patient support programs for drug manufacturers; the authorized claims include alleged breaches of Québec's private-sector privacy law and the Québec Charter, with compensatory and punitive damages sought.", "summary_zh": "Martin F. Sheehan法官批准就Innomar Strategies及其母公司Cencora所持信息于2024年2月21日前后被窃取一事，代表魁北克受影响者提起集体诉讼。Innomar为制药企业运营患者支持项目；获准的诉求包括涉嫌违反魁北克私营部门隐私法和《魁北克宪章》，原告寻求补偿性和惩罚性赔偿。", "impact_en": "Service providers holding patient data for others face direct class-action exposure in Québec; patient-support and similar programs need strong security and clear breach response.", "impact_zh": "代他人保管患者数据的服务商在魁北克面临直接的集体诉讼风险；患者支持等项目需要严格的安全措施和清晰的泄露应对。", "obligations": ["security", "breach"], "impact_level": "medium", "verified": true, "note": "Authorization-stage ruling; allegations are not proven. Droit-inc (2026-08-21) reports three similar actions in B.C. and Ontario."}, {"id": "news-012", "type": "news", "title": "Full restoration of services and update on personal information", "title_short_en": "CCQ cyberattack: client and employee data stolen", "title_zh": "魁北克建筑委员会遭网络攻击，数据被盗", "date": "2026-09-04", "org": "Commission de la construction du Québec", "url": "https://www.ccq.org/en/Nouvelles/2026/Reprise-renseignements-personnels", "summary_en": "The Commission de la construction du Québec, which has been dealing with a cyberattack since August 24, 2026, confirmed that certain client and employee information was stolen and offered free Equifax credit and dark-web monitoring. A September 29 update extended protection to more people, mainly former workers whose social insurance numbers may have been affected.", "summary_zh": "魁北克建筑委员会（CCQ）自2026年8月24日起应对一起网络攻击，确认部分客户和员工信息被盗，并提供免费的Equifax信用监控和暗网监控。9月29日的更新将保护措施扩展到更多人，主要是社会保险号可能受影响的前工人。", "impact_en": "Long retention of former clients' identifiers widens the impact of a breach; public bodies should review retention of SINs and keep contact data usable for notification.", "impact_zh": "长期保存前客户的身份标识会扩大泄露影响；公共机构应审查社会保险号的保存，并确保联系信息可用于通知。", "obligations": ["breach", "security"], "impact_level": "high", "verified": true, "note": "Number affected not stated on CCQ pages; La Presse headline (2026-09-04) reports 350,000 people, but the article could not be opened. September 29 update: https://www.ccq.org/en/Nouvelles/2026/Incident-securite-informatique-29-septembre-2026", "partial": true}, {"id": "news-013", "type": "news", "title": "Pornhub visée par une action collective de 600 M$ au Québec", "title_short_en": "Class action authorized against Pornhub owner Aylo", "title_zh": "针对Pornhub母公司Aylo的集体诉讼获准", "date": "2026-10-13", "org": "Noovo Info", "url": "https://www.noovo.info/nouvelles/justice/article/pornhub-visee-par-une-action-collective-de-600-m-au-quebec/", "summary_en": "Justice Donald Bisson of the Québec Superior Court authorized a class action against Aylo (formerly MindGeek), operator of Pornhub, and two former executives, on behalf of everyone in Québec whose intimate images or videos were published on its platforms without consent; the plaintiffs seek $600 million. The judge refused to limit the class to content left online after a removal request, stating that posting intimate content without consent is the alleged fault.", "summary_zh": "魁北克高等法院Donald Bisson法官批准针对Pornhub运营方Aylo（原MindGeek）及两名前高管的集体诉讼，代表所有亲密照片或视频未经同意被发布在其平台上的魁北克人，原告索赔6亿元。法官拒绝将集体限定为提出删除请求后内容仍在线的情形，认为未经同意发布亲密内容本身即为所指控的过错。", "impact_en": "Platforms hosting user content face exposure for non-consensual intimate images regardless of takedown requests; consent verification and removal processes need to be robust.", "impact_zh": "托管用户内容的平台无论是否收到删除请求，都可能因未经同意的亲密影像承担风险；同意核验和删除流程必须健全。", "obligations": ["consent", "children", "enforcement"], "impact_level": "high", "verified": true, "note": "Authorization-stage ruling; allegations are not proven and $600M is the amount claimed.", "partial": true}]}], "events": {"checked_at": "2026-10-25", "items": [{"id": "ev-001", "title": "4th Annual Forum on Artificial Intelligence (AI) and the Law", "title_zh": "第四届人工智能与法律年度论坛", "start": "2026-10-27", "end": "2026-10-28", "organizer": "Osgoode Professional Development", "format": "virtual", "city": null, "jurisdiction_focus": "national", "topics": ["adm_ai", "accountability"], "cpd": null, "price_note": null, "url": "https://osgoodepd.ca/?p=42356", "desc_en": "Two-day live online forum on AI regulation, governance, risk and liability for lawyers and compliance professionals.", "desc_zh": "为期两天的线上直播论坛，讨论人工智能监管、治理、风险与责任，面向律师和合规人员。", "verified": true, "note": "Dates from the OsgoodePD AI programs page; an online replay is offered in late November."}, {"id": "ev-002", "title": "Data on the Land: First Nations at the Centre of Canada's AI Infrastructure Boom", "title_zh": "土地上的数据：原住民在加拿大AI基础设施热潮中的核心地位", "start": "2026-11-06", "end": null, "organizer": "OBA", "format": "virtual", "city": null, "jurisdiction_focus": "national", "topics": ["adm_ai"], "cpd": null, "price_note": null, "url": "https://www.oba.org/professional-development", "desc_en": "OBA Aboriginal Law section webinar (12:00–1:30 pm ET) on First Nations' role in AI-related data centre projects.", "desc_zh": "安大略律师协会原住民法       const cx=x(i.date), cy=y+off[i.j]*0.6, op=faded?0.15:0.92;
      const mark=isNews(i)?`<rect x="${cx-rr*0.8}" y="${cy-rr*0.8}" width="${rr*1.6}" height="${rr*1.6}" transform="rotate(45 ${cx} ${cy})" fill="none" stroke="${col}" stroke-width="1.6" opacity="${op}"/>`
        :`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${i.pending?'none':col}" stroke="${col}" stroke-width="${i.pending?1.5:0}" opacity="${op}"/>`;
      s+=`<g class="dotbtn" tabindex="0" role="button" data-id="${i.id}" aria-label="${esc(i.date+' '+title(i))}"><title>${esc(i.date+' · '+jOf(i.j).code+' · '+title(i))}</title>${mark}</g>`;
    });
  });
  s+='</svg>';
  const el=document.getElementById('tl'); el.innerHTML=s;
  el.querySelectorAll('.dotbtn').forEach(g=>{const go=()=>focusItem(g.dataset.id); g.addEventListener('click',go); g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});
}
function focusItem(id){
  const it=items.find(x=>x.id===id); fJ=it?it.j:'all';fT='all';fO=null;showAll=true;open.add(id);
  renderCards();renderRadar();renderFilters();renderLog();renderTimeline();
  const el=document.getElementById('row-'+id); if(el){el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'}); el.focus({preventScroll:true});}
}
function renderRadar(){
  const mx=Math.max(1,...OB.flatMap(([k])=>J.map(j=>score(items.filter(i=>i.j===j.k&&(i.obligations||[]).includes(k))))));
  document.getElementById('radar').innerHTML=OB.map(([k,en,zh])=>`<button type="button" class="ob" id="ob-${k}" data-k="${k}" aria-pressed="${fO===k}">
    <span class="n">${esc(lang==='en'?en:zh)}</span><span class="bars">${J.map(j=>{
      const sc=score(items.filter(i=>i.j===j.k&&(i.obligations||[]).includes(k))); const b=(base[j.k]||{})[k]||{};
      return `<span class="row c-${j.k}"><span>${j.code}</span><span class="track"><span class="fill" style="width:${sc/mx*100}%"></span></span>${(b.pending_en||b.pending_zh)?'<span class="pd" title="pending"></span>':'<span></span>'}</span>`;}).join('')}</span></button>`).join('');
  document.querySelectorAll('.ob').forEach(b=>b.addEventListener('click',()=>{fO=(fO===b.dataset.k?null:b.dataset.k);showAll=false;renderRadar();renderLog();renderTimeline();}));
  const k=fO||'adm_ai';
  document.getElementById('base').innerHTML=J.map(j=>{const b=(base[j.k]||{})[k]||{}; const p=L(b,'pending');
    return `<div class="c-${j.k}"><span class="t">${j.code} · ${esc(j[lang])}</span><p><span class="lbl" style="margin-right:6px">${t('now')}</span>${esc(L(b,'now')||'—')}</p>
      <span class="bs">${esc(b.basis||'')}</span>${p?`<div class="pend"><b>${t('pending').toUpperCase()}</b>${esc(p)}${b.pending_basis?`<div class="bs" style="margin-top:4px">${esc(b.pending_basis)}</div>`:''}</div>`:''}</div>`;}).join('');
}
function renderFilters(){
  const f=document.getElementById('filters');
  f.innerHTML=[['all',t('all')]].concat(Object.entries(TYPES).map(([k,v])=>[k,v[lang==='en'?0:1]]))
    .map(([k,l])=>`<button type="button" class="chip" id="ft-${k}" data-v="${k}" aria-pressed="${fT===k}">${esc(l)}</button>`).join('');
  f.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{fT=c.dataset.v;showAll=false;renderFilters();renderLog();}));
}
function renderLog(){
  const list=items.filter(i=>(fJ==='all'||i.j===fJ)&&(fT==='all'||i.type===fT)&&(!fO||(i.obligations||[]).includes(fO)));
  const parts=[]; if(fJ!=='all') parts.push(jOf(fJ).code); if(fO){const o=OB.find(x=>x[0]===fO); parts.push(lang==='en'?o[1]:o[2]);}
  document.getElementById('af').innerHTML=`<span>${t('showing')} ${list.length}${parts.length?' · '+esc(parts.join(' · ')):''}</span>${parts.length?`<button type="button" id="clear">${t('clear')}</button>`:''}`;
  const c=document.getElementById('clear'); if(c) c.addEventListener('click',()=>{fJ='all';fO=null;renderCards();renderRadar();renderLog();renderTimeline();});
  const shown=showAll?list:list.slice(0,10);
  document.getElementById('log').innerHTML=shown.map(i=>{
    const j=jOf(i.j), lv=i.impact_level==='high'?3:i.impact_level==='medium'?2:1, isO=open.has(i.id);
    const ty=TYPES[i.type]?.[lang==='en'?0:1]||i.type;
    const obs=(i.obligations||[]).map(k=>{const o=OB.find(x=>x[0]===k);return o?`<span class="tag">${esc(lang==='en'?o[1]:o[2])}</span>`:''}).join('');
    return `<li class="c-${i.j}"><button type="button" class="row-btn" id="row-${i.id}" data-id="${i.id}" aria-expanded="${isO}">
      <span class="d">${esc(i.date||'—')}</span><span class="jt">${j.code}</span>
      <span class="ti"><b>${esc(title(i))}</b><small data-date="${esc(i.date||'—')}">${esc(ty)}${i.org?' · '+esc(i.org):''}${i.pending?' · '+esc(t('pending')):''}</small></span>
      <span class="imp l${lv}" aria-label="${esc(i.impact_level)}"><i></i><i></i><i></i></span><span class="chev">›</span></button>
      ${isO?`<div class="exp"><p>${esc(L(i,'summary'))}</p><p class="w"><b>${t('watch').toUpperCase()}</b>${esc(L(i,'impact'))}</p>
        ${L(i,'status')?`<p class="mono" style="font-size:12px;color:var(--muted)">${esc(L(i,'status'))}</p>`:''}
        <div class="tags">${obs}</div>
        <div class="src"><a href="${esc(i.url)}" target="_blank" rel="noopener">${isNews(i)?t('srcNews'):t('source')}</a>${!ver(i)?`<span class="note">${t('unverified')}</span>`:''}${i.partial?`<span class="note">${t('partial')}</span>`:''}</div></div>`:''}</li>`;
  }).join('');
  document.querySelectorAll('.row-btn').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id; open.has(id)?open.delete(id):open.add(id); renderLog(); const n=document.getElementById('row-'+id); if(n) n.focus({preventScroll:true});}));
  document.getElementById('more').innerHTML=(!showAll&&list.length>10)?`<button type="button" id="more-btn">${t('more')} (${list.length})</button>`:'';
  const m=document.getElementById('more-btn'); if(m) m.addEventListener('click',()=>{showAll=true;renderLog();});
}

let view='watch', evF='all';
const TODAY=new Date((checked||'2026-10-25')+'T00:00:00Z');
const dDiff=s=>Math.round((new Date(s+'T00:00:00Z')-TODAY)/864e5);
function renderTabs(){
  document.getElementById('tab-watch').textContent=t('tabWatch'); document.getElementById('tab-events').textContent=t('tabEvents');
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===view)));
  document.getElementById('view-watch').hidden=view!=='watch'; document.getElementById('view-watch').style.display=view==='watch'?'contents':'none';
  document.getElementById('view-events').hidden=view!=='events';
}
function renderEvents(){
  document.getElementById('evh1').innerHTML=t('evH1');
  const up=EVENTS.filter(e=>dDiff(e.end||e.start)>=0).sort((a,b)=>a.start.localeCompare(b.start));
  const nx=up[0];
  document.getElementById('ev-next').innerHTML=nx?`<span class="lbl">${t('evNext')}</span><b>${dDiff(nx.start)<=0?esc(t('evToday')):`${dDiff(nx.start)} <span style="font-size:18px;color:var(--muted)">${t('evDays')}</span>`}</b><a href="${esc(nx.url)}" target="_blank" rel="noopener">${esc(lang==='en'?nx.title:(nx.title_zh||nx.title))}</a><span class="lbl">${up.length} ${t('evUpcoming')}</span>`:'';
  const f=document.getElementById('ev-filters');
  f.innerHTML=['all','in_person','virtual','hybrid'].filter(k=>k==='all'||up.some(e=>e.format===k)).map(k=>`<button type="button" class="chip" id="evf-${k}" data-v="${k}" aria-pressed="${evF===k}">${t(k==='all'?'fAll':k)}</button>`).join('');
  f.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{evF=c.dataset.v;renderEvents();}));
  const list=up.filter(e=>evF==='all'||e.format===evF);
  const MON=lang==='en'?['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC']:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const groups={}; list.forEach(e=>{const k=e.start.slice(0,7);(groups[k]=groups[k]||[]).push(e);});
  document.getElementById('agenda').innerHTML=Object.keys(groups).length?Object.entries(groups).map(([k,es])=>{
    const [y,m]=k.split('-');
    return `<div class="mon"><h3>${MON[+m-1]} ${y}</h3>${es.map(e=>{
      const d=dDiff(e.start); const tp=(e.topics||[]).map(x=>{const o=OB.find(z=>z[0]===x);return o?`<span class="tag">${esc(lang==='en'?o[1]:o[2])}</span>`:''}).join('');
      const range=e.end&&e.end!==e.start?`${e.start.slice(5)} → ${e.end.slice(5)}`:e.start.slice(5);
      return `<div class="ev"><div class="cal"><span>${MON[+m-1]}</span><b>${+e.start.slice(8,10)}</b></div>
        <div class="main"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(lang==='en'?e.title:(e.title_zh||e.title))}</a>
        <p>${esc(lang==='en'?e.desc_en:(e.desc_zh||e.desc_en))}</p>
        <div class="tags"><span class="fmt ${esc(e.format)}">${esc(t(e.format)||e.format)}</span><span class="tag">${esc(e.organizer)}</span>${e.city?`<span class="tag">${esc(e.city)}</span>`:''}${e.cpd?`<span class="tag">${esc(e.cpd)}</span>`:''}${e.price_note?`<span class="tag">${esc(e.price_note)}</span>`:''}${tp}</div></div>
        <div class="days">${esc(range)}<br>${d<=0?esc(t('evToday')):(lang==='en'?`in ${d} days`:`还有 ${d} 天`)}</div></div>`;}).join('')}</div>`;}).join(''):`<p class="lbl">${t('evNone')}</p>`;
}
function setView(v){view=v;renderTabs();if(v==='events')renderEvents();try{history.replaceState(null,'',v==='events'?'#events':'#');}catch(e){}window.scrollTo(0,0);}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
if(location.hash==='#events') view='events';
if(!EVENTS.length) document.getElementById('tab-events').hidden=true;
function all(){renderStatic();renderTabs();renderCards();renderTimeline();renderRadar();renderFilters();renderLog();if(view==='events')renderEvents();}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('pw-lang',lang)}catch(e){} all();}));
open.add(items.find(i=>i.impact_level==='high'&&ver(i)&&!isNews(i))?.id);
all();
})();
</script>
